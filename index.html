<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inhala&Co</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#146c43">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --green-950:#0b1f16;
    --green-900:#0f2b1e;
    --green-800:#123825;
    --green-700:#146c43;
    --green-600:#1a8a56;
    --green-500:#2fa36b;
    --green-400:#4bc48a;
    --green-100:#e3f3ea;
    --green-50:#f4faf6;
    --amber:#b45309;
    --amber-bg:#fef3e0;
    --red:#c0362c;
    --red-bg:#fbe9e7;
    --ink:#12241c;
    --ink-soft:#54655c;
    --ink-faint:#8a988f;
    --line:#e1e9e3;
    --bg:#f6faf7;
    --surface:#ffffff;
    --shadow: 0 1px 2px rgba(15,43,30,.06), 0 6px 20px -8px rgba(15,43,30,.12);
    --radius: 12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Roboto','Google Sans','Segoe UI',Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:76px; flex:0 0 76px;
    background:linear-gradient(180deg,var(--green-900),var(--green-950));
    color:#eaf6ee;
    display:flex; flex-direction:column;
    padding:18px 8px;
    position:sticky; top:0; height:100vh;
    transition:background .2s ease;
  }
  .brand{display:flex; align-items:center; justify-content:center; padding:0 0 22px;}
  .brand-logo{width:46px; height:46px; object-fit:cover; border-radius:13px; background:#fff; border:1px solid rgba(255,255,255,.16); box-shadow:0 5px 14px rgba(0,0,0,.22);}
  .nav{display:flex; flex-direction:column; gap:5px; margin-top:6px;}
  .nav-item{
    display:flex; align-items:center; justify-content:center;
    height:46px; padding:10px; border-radius:11px;
    color:#c9dccf; font-size:14px; font-weight:500;
    cursor:pointer; border:none; background:transparent; text-align:left; width:100%;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item svg{flex:0 0 auto; opacity:.9;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{background:var(--green-600); color:#fff; box-shadow:0 4px 14px -4px rgba(47,163,107,.55);}
  .nav-sep{height:1px; background:rgba(255,255,255,.08); margin:14px 4px;}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 30px; border-bottom:1px solid var(--line); background:var(--surface);
    position:sticky; top:0; z-index:20;
  }
  .topbar h1{font-size:19px; margin:0; font-weight:700; letter-spacing:-.2px;}
  .topbar .sub{color:var(--ink-soft); font-size:13px; margin-top:2px;}
  .sync-status{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;font-weight:700;color:var(--green-700)}
  .sync-status::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green-500);box-shadow:0 0 0 3px var(--green-100)}
  .sync-status.syncing{color:var(--amber)} .sync-status.syncing::before{background:var(--amber)}
  .sync-status.offline{color:var(--red)} .sync-status.offline::before{background:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
  .payment-box{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.payment-row{display:grid;grid-template-columns:1fr 150px 30px;gap:8px;align-items:center;margin-top:7px}.payment-total{font-size:12px;margin-top:9px;color:var(--ink-soft)}
  .content{padding:26px 30px 60px; flex:1;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---------- Generic ---------- */
  .grid{display:grid; gap:16px;}
  .kpis{grid-template-columns:repeat(4,1fr); margin-bottom:20px;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .kpi{padding:18px 20px; position:relative; overflow:hidden;}
  .kpi .label{font-size:12.5px; color:var(--ink-soft); font-weight:500; display:flex; align-items:center; gap:6px;}
  .kpi .value{font-size:26px; font-weight:900; margin-top:8px; letter-spacing:-.5px;}
  .kpi .delta{font-size:12px; margin-top:6px; color:var(--ink-faint);}
  .kpi.warn{border-color:#f3d9ad;}
  .kpi.danger{border-color:#f0c4bd;}
  .kpi-bar{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--green-500);}
  .kpi.warn .kpi-bar{background:#d68a1d;}
  .kpi.danger .kpi-bar{background:var(--red);}

  h2.section-title{font-size:15px; font-weight:700; margin:0 0 12px 2px; letter-spacing:-.1px;}
  .two-col{grid-template-columns:1.3fr 1fr;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px;
    color:var(--ink-soft); font-weight:700; padding:9px 12px; border-bottom:1px solid var(--line);
    background:var(--green-50); white-space:nowrap;
  }
  td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--green-50);}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:100px;}
  .badge.ok{background:var(--green-100); color:var(--green-700);}
  .badge.low{background:var(--amber-bg); color:var(--amber);}
  .badge.out{background:var(--red-bg); color:var(--red);}
  .badge.dot::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}

  .btn{
    display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600;
    padding:9px 15px; border-radius:9px; border:1px solid transparent; cursor:pointer;
    background:var(--green-600); color:#fff; transition:filter .12s ease, transform .04s ease;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:var(--surface); color:var(--ink); border-color:var(--line);}
  .btn.secondary:hover{background:var(--green-50); border-color:var(--green-500);}
  .btn.ghost{background:transparent; color:var(--green-700); padding:7px 10px;}
  .btn.ghost:hover{background:var(--green-100);}
  .btn.danger{background:var(--red); color:#fff;}
  .btn.sm{padding:6px 10px; font-size:12px; border-radius:7px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .icon-btn{
    width:30px; height:30px; border-radius:7px; border:1px solid var(--line); background:var(--surface);
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
  }
  .icon-btn:hover{background:var(--green-50); color:var(--green-700); border-color:var(--green-500);}

  input, select{
    font-family:inherit; font-size:13px; padding:8px 11px; border-radius:8px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink); outline:none;
  }
  input:focus, select:focus{border-color:var(--green-500); box-shadow:0 0 0 3px var(--green-100);}
  input.cell-edit{padding:5px 7px; width:100%; font-size:13px;}
  label.field-label{font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:5px;}

  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  .toolbar .search{flex:1; min-width:220px; position:relative;}
  .toolbar .search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint);}
  .toolbar .search input{width:100%; padding-left:34px;}
  .pill-count{font-size:11px; background:var(--green-100); color:var(--green-700); padding:2px 8px; border-radius:100px; font-weight:700;}

  .empty{padding:50px 20px; text-align:center; color:var(--ink-soft);}
  .empty svg{color:var(--green-400); margin-bottom:10px;}
  .empty .t{font-weight:700; color:var(--ink); font-size:14px; margin-bottom:4px;}

  .pagination{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; font-size:12.5px; color:var(--ink-soft);}
  .pagination .btns{display:flex; gap:6px;}

  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(11,31,22,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .overlay.active{display:flex;}
  .modal{background:var(--surface); border-radius:14px; width:100%; max-width:460px; box-shadow:0 20px 60px -12px rgba(0,0,0,.35); max-height:90vh; overflow:auto;}
  .modal-head{padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
  .modal-head h3{margin:0; font-size:16px;}
  .modal-body{padding:20px 22px; display:flex; flex-direction:column; gap:14px;}
  .modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .hint{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}

  /* ---------- Ticket de venta ---------- */
  .ticket-doc{background:#fff; border:1px dashed var(--line); border-radius:8px; padding:16px 14px; font-family:'Roboto Mono','Courier New',monospace; font-size:12px; line-height:1.55; color:var(--ink);}
  .ticket-doc .t-center{text-align:center;}
  .ticket-doc .t-logo{max-width:120px; max-height:60px; object-fit:contain; margin:0 auto 8px; display:block;}
  .ticket-doc .t-business{font-weight:700; font-size:14px;}
  .ticket-doc .t-muted{color:var(--ink-soft); font-size:11px;}
  .ticket-doc .t-sep{border:none; border-top:1px dashed var(--ink-faint); margin:10px 0;}
  .ticket-doc .t-row{display:flex; justify-content:space-between; gap:8px;}
  .ticket-doc .t-items .t-item{margin-bottom:6px;}
  .ticket-doc .t-items .t-item-name{display:flex; justify-content:space-between; gap:8px; font-weight:600;}
  .ticket-doc .t-items .t-item-meta{display:flex; justify-content:space-between; gap:8px; color:var(--ink-soft); font-size:11px;}
  .ticket-doc .t-total{font-weight:700; font-size:15px;}
  .ticket-doc .t-footer{margin-top:10px; text-align:center; font-size:11.5px; color:var(--ink-soft); white-space:pre-wrap;}

  /* POS */
  .pos-hero{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 20px; margin-bottom:18px; background:linear-gradient(120deg,#fff,var(--green-50));}
  .pos-hero-title{display:flex; align-items:center; gap:13px;}
  .pos-hero-icon{width:48px; height:48px; border-radius:12px; background:var(--green-100); color:var(--green-700); display:flex; align-items:center; justify-content:center;}
  .pos-hero-icon svg{width:25px; height:25px;}
  .pos-hero h2{margin:0; font-size:21px; letter-spacing:-.3px;}
  .pos-hero p{margin:3px 0 0; color:var(--ink-soft); font-size:13px;}
  .pos-grid{grid-template-columns:1.28fr .92fr; align-items:start; gap:18px;}
  .pos-panel{padding:18px 20px; border-radius:14px;}
  .pos-panel-title{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;}
  .pos-panel-title h2{display:flex; align-items:center; gap:9px; margin:0; font-size:16px;}
  .pos-panel-title h2 svg{color:var(--green-600);}
  .pos-search-row{display:flex; gap:10px; margin-bottom:12px;}
  .pos-search-row .search{flex:1; position:relative;}
  .pos-search-row .search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint);}
  .pos-search-row .search input{width:100%; padding-left:34px;}
  .pos-filter{min-width:134px;}
  .pos-results{max-height:560px; overflow:auto; border:1px solid var(--line); border-radius:10px;}
  .pos-row{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s ease, transform .12s ease;}
  .pos-row:last-child{border-bottom:none;}
  .pos-row:hover{background:var(--green-50);}
  .pos-row .name{font-weight:600; font-size:13px;}
  .pos-row .meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .pos-row .price{font-weight:800; font-size:13px; color:var(--green-700);}
  .pos-row .add-arrow{font-size:24px; line-height:1; margin-left:12px; color:var(--ink-faint);}
  .sale-data-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .sale-data-grid .span-2{grid-column:1/-1;}
  .sale-receipt{border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--surface);}
  .sale-receipt-head{padding:14px; background:linear-gradient(135deg,var(--green-50),#fff); border-bottom:1px solid var(--green-100);}
  .sale-receipt-lines{padding:5px 14px 0; max-height:340px; overflow:auto;}
  .cart-columns{display:grid; grid-template-columns:minmax(0,1fr) 108px 96px 104px 28px; gap:8px; align-items:center; padding:11px 0 8px; font-size:10.5px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.2px;}
  .sale-receipt-summary{margin:0 14px 14px; padding:10px 12px; border-radius:9px; background:var(--green-50); border:1px solid var(--green-100);}
  .cart-item{display:grid; grid-template-columns:minmax(0,1fr) 108px 96px 104px 28px; gap:8px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
  .cart-item:last-child{border-bottom:none;}
  .cart-product{display:flex; align-items:center; gap:9px; min-width:0;}
  .cart-item .name{min-width:0; font-size:12.5px; font-weight:700;}
  .cart-unit{font-size:12px; color:var(--ink-soft);}
  .cart-subtotal{text-align:right; font-size:14px;}
  .qty-ctrl{display:flex; align-items:center; gap:4px;}
  .qty-ctrl button{width:24px; height:24px; border-radius:6px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-weight:700;}
  .qty-ctrl input{width:38px; text-align:center; padding:4px;}
  .weight-ctrl{display:flex; flex-direction:column; gap:2px;}
  .weight-ctrl input{width:88px; text-align:center; padding:5px 4px; font-size:12.5px;}
  .weight-ctrl .hint{margin:0; font-size:10px; line-height:1.2;}
  .unit-toggle{display:flex; gap:14px; align-items:center; margin-top:4px;}
  .unit-toggle label{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:500; cursor:pointer;}
  .cart-total-row{display:flex; justify-content:space-between; padding:8px 0; font-size:13.5px;}
  .cart-total-row.grand{font-size:20px; font-weight:900; border-top:1px solid var(--green-100); margin-top:6px; padding-top:12px; color:var(--green-900);}
  .sale-action{width:100%; justify-content:center; margin-top:14px; padding:13px; font-size:14px;}
  .sale-history-actions{display:flex; justify-content:flex-end; gap:6px;}
  .sale-security{display:flex; align-items:center; justify-content:center; gap:7px; color:var(--ink-soft); font-size:11.5px; margin-top:13px;}

  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{font-size:12px; padding:6px 12px; border-radius:100px; border:1px solid var(--line); background:var(--surface); cursor:pointer; color:var(--ink-soft); font-weight:600; display:inline-flex; align-items:center; gap:6px;}
  .chip.active{background:var(--green-600); border-color:var(--green-600); color:#fff;}

  .bars{display:flex; align-items:flex-end; gap:6px; height:140px; padding:10px 4px 0;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .bar{width:100%; border-radius:5px 5px 2px 2px; background:linear-gradient(180deg,var(--green-400),var(--green-600)); min-height:2px;}
  .bar-col .lbl{font-size:9.5px; color:var(--ink-faint); white-space:nowrap;}

  .toast-wrap{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--green-900); color:#fff; padding:12px 18px; border-radius:10px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow); display:flex; align-items:center; gap:9px; animation:slideIn .18s ease;}
  .toast.err{background:var(--red);}
  @keyframes slideIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  .loading-screen{position:fixed; inset:0; background:#f8fbfa; display:flex; align-items:center; justify-content:flex-end; flex-direction:column; gap:10px; z-index:500; padding:clamp(24px,6vh,68px); overflow:hidden;}
  .loading-cover{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center center; z-index:0;}
  .loading-screen::after{content:''; position:absolute; inset:0; z-index:1; background:linear-gradient(180deg,transparent 70%,rgba(255,255,255,.5)); pointer-events:none;}
  .loading-screen > :not(.loading-cover){position:relative; z-index:2;}
  .spinner{width:30px; height:30px; border-radius:50%; border:3px solid rgba(20,108,67,.18); border-top-color:var(--green-600); animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .cat-chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:100px; border:1px solid; white-space:nowrap;}
  .cat-chip.sm{font-size:10.5px; padding:2px 8px; font-weight:600;}
  .cat-dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto; display:inline-block;}
  .chip .cat-dot{margin-right:1px;}
  .thumb-img{object-fit:cover; border-radius:8px; border:1px solid var(--line); background:var(--green-50); flex:0 0 auto; display:block;}
  .settings-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
  .settings-card{padding:20px;}
  .settings-preview{height:180px; margin-top:14px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--green-50); position:relative;}
  .settings-preview.cover{background:center/cover no-repeat;}
  .settings-preview.logo{display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#eff7f1,#dcefe2);}
  .settings-preview.logo img{width:116px; height:116px; object-fit:cover; border-radius:24px; background:#fff; box-shadow:0 10px 24px rgba(15,43,30,.16);}
  .settings-preview-label{position:absolute; left:10px; bottom:10px; color:#fff; background:rgba(11,31,22,.72); font-size:11px; font-weight:700; padding:5px 8px; border-radius:6px;}
  .sortable{cursor:pointer; user-select:none;}
  .sortable .arrow{opacity:.4; margin-left:3px;}
  .muted{color:var(--ink-faint);}
  .num{font-variant-numeric:tabular-nums;}
  .strong{font-weight:700;}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#cfe0d5; border-radius:20px;}
  @media(max-width:980px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    .two-col, .pos-grid{grid-template-columns:1fr;}
    .sidebar{width:76px; flex:0 0 76px; padding:18px 8px;}
    .content{padding:20px 22px 46px;}
    .topbar{padding:17px 22px;}
  }
  @media(max-width:620px){
    .sidebar{width:58px; flex:0 0 58px; padding:12px 6px;}
    .brand{padding-bottom:16px;}
    .brand-logo{width:38px; height:38px; border-radius:11px;}
    .nav{gap:4px;}
    .nav-item{height:42px; padding:8px; border-radius:10px;}
    .content{padding:14px 12px 32px; overflow:hidden;}
    .topbar{padding:13px 14px; min-height:64px;}
    .topbar h1{font-size:17px;}
    .topbar .sub{display:none;}
    .sync-status{font-size:10px; margin-top:3px; white-space:nowrap;}
    .settings-grid{grid-template-columns:1fr;}
    .pos-hero{padding:14px; align-items:flex-start;}
    .pos-hero h2{font-size:18px;}
    .pos-hero .btn{padding:8px 10px; font-size:0;}
    .pos-hero .btn svg{margin:0;}
    .pos-panel{padding:14px;}
    .pos-search-row{flex-direction:column;}
    .pos-search-row .btn{justify-content:center; width:100%;}
    .pos-filter{width:100%;}
    .sale-data-grid{grid-template-columns:1fr;}
    .sale-data-grid .span-2{grid-column:auto;}
    .cart-columns{display:none;}
    .cart-item{grid-template-columns:minmax(0,1fr) 92px 28px; gap:8px;}
    .cart-unit{display:none;}
    .cart-subtotal{grid-column:2; grid-row:1; font-size:13px;}
    .qty-ctrl{grid-column:2; grid-row:2;}
    .cart-item > .icon-btn{grid-column:3; grid-row:1 / span 2;}
    .overlay{padding:8px; align-items:flex-start; overflow:auto;}
    .modal{max-width:none; max-height:calc(100dvh - 16px); margin:auto 0; border-radius:13px;}
    .modal-head{padding:14px 16px;}
    .modal-body{padding:16px; gap:12px;}
    .modal-foot{padding:12px 16px; position:sticky; bottom:0; background:var(--surface); flex-wrap:wrap;}
    .modal-foot .btn{flex:1; justify-content:center; min-width:0;}
    .field-row{grid-template-columns:1fr; gap:10px;}
    .toast-wrap{left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom));}
    .toast{width:100%; padding:11px 13px; font-size:12.5px;}
  }
</style>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
  import { getAuth, onAuthStateChanged, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: 'AIzaSyCsdF5kcVk_TeNb6qqgC00_bpwm-78UJbE',
    authDomain: 'sistemainhala.firebaseapp.com',
    projectId: 'sistemainhala',
    storageBucket: 'sistemainhala.firebasestorage.app',
    messagingSenderId: '445787560913',
    appId: '1:445787560913:web:eb2946856e0a9094e45ef0'
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const inventoryRef = doc(db, 'inhala_private', 'inventory');
  const salesRef = doc(db, 'inhala_private', 'sales');
  const clientsRef = doc(db, 'inhala_private', 'clients');
  const settingsRef = doc(db, 'inhala_private', 'settings');
  let currentUser = null, userResolver = null;
  const userReady = new Promise(resolve => { userResolver = resolve; });

  onAuthStateChanged(auth, user => {
    currentUser = user || null;
    if(currentUser){ userResolver(currentUser); window.dispatchEvent(new Event('inhala-authenticated')); }
    else{
      // Acceso libre: se autentica automáticamente de forma anónima, sin pedir mail ni contraseña.
      window.dispatchEvent(new Event('inhala-auth-required'));
      signInAnonymously(auth).catch(err => {
        console.error('No se pudo iniciar sesión anónima', err);
        window.dispatchEvent(new CustomEvent('inhala-auth-error', { detail: err }));
      });
    }
  });

  window.inhalaCloud = {
    async waitForUser(){ return currentUser || userReady; },
    getCurrentUserEmail(){ return currentUser ? (currentUser.email || currentUser.displayName || '') : ''; },
    async load(){
      const [inventory, sales, clients, settings] = await Promise.all([getDoc(inventoryRef), getDoc(salesRef), getDoc(clientsRef), getDoc(settingsRef)]);
      return { inventoryExists: inventory.exists(), inventory: inventory.exists() ? inventory.data() : null, sales: sales.exists() ? sales.data() : null, clients: clients.exists() ? clients.data() : null, settingsExists: settings.exists(), settings: settings.exists() ? settings.data() : null };
    },
    saveInventory(products, seq){ return setDoc(inventoryRef, { products, seq, updatedAt: Date.now() }); },
    saveSales(sales){ return setDoc(salesRef, { sales, updatedAt: Date.now() }); },
    saveClients(clients){ return setDoc(clientsRef, { clients, updatedAt: Date.now() }); },
    saveSettings(settings){ return setDoc(settingsRef, { settings, updatedAt: Date.now() }); },
    subscribe(onInventory, onSales, onClients, onSettings){
      const stopInventory = onSnapshot(inventoryRef, snap => { if(snap.exists()) onInventory(snap.data()); });
      const stopSales = onSnapshot(salesRef, snap => { if(snap.exists()) onSales(snap.data()); });
      const stopClients = onSnapshot(clientsRef, snap => { if(snap.exists()) onClients(snap.data()); });
      const stopSettings = onSnapshot(settingsRef, snap => { if(snap.exists() && onSettings) onSettings(snap.data()); });
      return () => { stopInventory(); stopSales(); stopClients(); stopSettings(); };
    }
  };
  window.dispatchEvent(new Event('inhala-cloud-ready'));
</script>

/* ---------- Productos vendidos por peso (kg) ---------- */
// Interpreta texto de peso ingresado a mano y lo devuelve siempre en KILOS.
// Reglas: "150" o "150g"/"150gr"/"150grs" -> 150 gramos (0.150 kg). "2,5kg" o "2.5 kg" -> 2.5 kg.
// Acepta coma o punto como separador decimal. Devuelve null si no se puede interpretar.
function parseWeightToKg(text){
  if(text==null) return null;
  const raw = String(text).trim().toLowerCase().replace(/\s+/g,'');
  if(!raw) return null;
  const m = raw.match(/^([0-9]+(?:[.,][0-9]+)?)(kg|kgs|g|gr|grs)?$/);
  if(!m) return null;
  const num = parseFloat(m[1].replace(',', '.'));
  if(isNaN(num) || num<0) return null;
  const unit = m[2] || 'g'; // sin unidad explícita se asume gramos
  const kg = (unit==='kg' || unit==='kgs') ? num : num/1000;
  return Math.round(kg*1000)/1000; // redondeo interno a 1 gramo de precisión
}
// Formatea un peso en kg como texto legible: "150 g" si es menor a 1kg, "2,5 kg" si no.
function formatWeightKg(kg){
  const n = Number(kg)||0;
  if(n < 1) return Math.round(n*1000) + ' g';
  const rounded = Math.round(n*1000)/1000;
  return rounded.toLocaleString('es-AR', {maximumFractionDigits:3}) + ' kg';
}
// Texto de cantidad para carrito/ticket/historial, según si el ítem se vende por peso o por unidad.
function formatItemQty(item){
  if(item && item.unit==='kg') return formatWeightKg(item.qty);
  const q = Number(item && item.qty)||0;
  return fmtInt(q) + ' ' + (q===1?'unidad':'unidades');
}
// Precio unitario mostrado: aclara "/kg" para productos vendidos por peso.
function formatUnitPrice(item){
  return fmt(item.price) + (item && item.unit==='kg' ? '/kg' : '');
}
// Detecta productos cuyo nombre o descripción indica que se venden por kilo.
// Ejemplos: "por kg", "1 kg", "10kg", "2,5 kilos".
function productIndicatesWeightSale(product){
  const text = [product && product.name, product && product.description, product && product.details]
    .filter(Boolean).join(' ').toLowerCase();
  return /\bpor\s+(?:peso\s*\(?\s*)?(?:kg|kgs|kilo(?:s)?)\b|\b\d+(?:[.,]\d+)?\s*(?:kg|kgs|kilo(?:s)?)\b/.test(text);
}
// Migración segura: solo activa "A granel" y nunca modifica el resto de los datos.
function applyAutomaticWeightSales(products){
  let updated = 0;
  (products || []).forEach(product => {
    if(!product.soldByWeight && productIndicatesWeightSale(product)){
      product.soldByWeight = true;
      updated++;
    }
  });
  return updated;
}
// Redondeo del subtotal: al peso (moneda) más cercano, para evitar centavos raros.
function roundMoney(n){ return Math.round(Number(n)||0); }
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeImageUrl(value, fallback){
  const v = String(value||'').trim();
  return /^https?:\/\//i.test(v) ? v : fallback;
}
function normalizeAppSettings(value){
  const requestedCover = String(value&&value.coverUrl||'').trim();
  const blockedTemporaryCover = /imgto\.link\/.*chatgpt-image.*\.avif(?:$|\?)/i.test(requestedCover);
  const ticketWidth = String(value&&value.ticketWidth||'').trim()==='58' ? '58' : DEFAULT_APP_SETTINGS.ticketWidth;
  const ticketSeq = Math.max(0, Math.round(Number(value&&value.ticketSeq)||0));
  return {
    coverUrl:blockedTemporaryCover ? '' : safeImageUrl(requestedCover, DEFAULT_APP_SETTINGS.coverUrl),
    logoUrl:safeImageUrl(value&&value.logoUrl, DEFAULT_APP_SETTINGS.logoUrl),
    businessName:String(value&&value.businessName||'').trim() || DEFAULT_APP_SETTINGS.businessName,
    businessAddress:String(value&&value.businessAddress||'').trim(),
    businessPhone:String(value&&value.businessPhone||'').trim(),

    ticketWidth,
    ticketFooter:String(value&&value.ticketFooter!=null?value.ticketFooter:DEFAULT_APP_SETTINGS.ticketFooter).slice(0,200),
    ticketSeq
  };
}

// Re-renders a view while keeping focus + cursor position on whatever input triggered it,
// so typing in a search box doesn't get interrupted by the innerHTML rebuild.
function withFocusPreserved(renderFn){
  const active = document.activeElement;
  let saved = null;
  if(active && active.id && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA')){
    saved = {id: active.id, start: active.selectionStart, end: active.selectionEnd};
  }
  renderFn();
  if(saved){
    const el = document.getElementById(saved.id);
    if(el){
      el.focus();
      if(typeof saved.start === 'number' && el.setSelectionRange){
        try{ el.setSelectionRange(saved.start, saved.end); }catch(e){}
      }
    }
  }
}

function productThumb(p, size){
  size = size || 36;
  const src = p.image ? esc(p.image) : IMG_FALLBACK;
  return `<img src="${src}" alt="" class="thumb-img" style="width:${size}px;height:${size}px;" onerror="this.onerror=null;this.src='${IMG_FALLBACK}';">`;
}

// Deterministic color per category name, so the same category always gets the same
// distinct color everywhere in the app (full inventory, filters, dashboard), with no
// extra config needed even for categories the user adds later.
function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h;
}
function categoryColor(cat){
  const hue = hashStr(String(cat||'Otros').trim().toLowerCase()) % 360;
  return {
    dot: `hsl(${hue},68%,42%)`,
    bg: `hsl(${hue},72%,95%)`,
    fg: `hsl(${hue},70%,26%)`,
    border: `hsl(${hue},55%,82%)`
  };
}
function categoryChip(cat, small){
  const c = categoryColor(cat);
  return `<span class="cat-chip${small?' sm':''}" style="background:${c.bg};color:${c.fg};border-color:${c.border};"><span class="cat-dot" style="background:${c.dot};"></span>${esc(cat)}</span>`;
}

/* ---------- Storage ---------- */
async function storageGet(key){
  // localStorage es el almacenamiento principal en navegador, incluido GitHub Pages y celular.
  try{
    const value=window.localStorage.getItem(key);
    if(value!==null) return JSON.parse(value);
  }catch(e){ console.warn('localStorage get error', e); }
  try{
    if(window.storage && typeof window.storage.get==='function'){
      const r=await window.storage.get(key, false);
      return r && r.value!==undefined ? JSON.parse(r.value) : null;
    }
  }catch(e){ console.warn('storage get fallback error', e); }
  return null;
}
async function storageSet(key, value){
  const serialized=JSON.stringify(value);
  let localOk=false;
  try{ window.localStorage.setItem(key, serialized); localOk=true; }
  catch(e){ console.error('localStorage set error', e); }
  // Compatibilidad secundaria con el almacenamiento embebido de Work, sin bloquear el guardado del navegador.
  try{ if(window.storage && typeof window.storage.set==='function') await window.storage.set(key, serialized, false); }
  catch(e){ console.warn('storage set mirror error', e); }
  return localOk;
}

/* ---------- 3 y 4. Estado de sync y cola offline ---------- */
function updateSyncIndicator(){
  const el = document.getElementById('syncStatus'); if(!el) return;
  const pending = syncQueue.length;
  if(!navigator.onLine){ el.className='sync-status offline'; el.textContent=pending ? `${pending} cambio${pending===1?'':'s'} pendiente${pending===1?'':'s'} · sin conexión` : 'Sin conexión · cambios locales'; return; }
  if(syncState.syncing){ el.className='sync-status syncing'; el.textContent=pending ? `Sincronizando · ${pending} pendiente${pending===1?'':'s'}` : 'Sincronizando…'; return; }
  if(pending){ el.className='sync-status syncing'; el.textContent=`${pending} cambio${pending===1?'':'s'} pendiente${pending===1?'':'s'} de subir`; return; }
  el.className='sync-status'; el.textContent=syncState.cloudAlive ? 'Sincronizado' : 'Esperando conexión con la nube';
}
async function loadSyncQueue(){ syncQueue = await storageGet('inhala_sync_queue') || []; updateSyncIndicator(); }
async function saveSyncQueue(){
  const ok = await storageSet('inhala_sync_queue', syncQueue);
  if(!ok) toast('No se pudo guardar la cola local de sincronización. No cierres la aplicación.', true);
  updateSyncIndicator(); return ok;
}
async function enqueueSync(type, payload){
  // Cada tipo es un snapshot: se conserva solo la versión más nueva y se evita subir datos viejos.
  syncQueue = syncQueue.filter(x=>x.type!==type);
  syncQueue.push({type, payload:JSON.parse(JSON.stringify(payload)), timestamp:Date.now()});
  await saveSyncQueue();
}
async function cloudSave(type, payload){
  if(!CLOUD || !navigator.onLine){ await enqueueSync(type,payload); return false; }
  try{
    syncState.syncing=true; updateSyncIndicator();
    if(type==='products') await CLOUD.saveInventory(payload.products, payload.seq);
    if(type==='sales') await CLOUD.saveSales(payload);
    if(type==='clients') await CLOUD.saveClients(payload);
    if(type==='settings') await CLOUD.saveSettings(payload);
    syncState.cloudAlive=true;
    return true;
  }catch(err){
    console.error('cloud sync error', type, err);
    await enqueueSync(type,payload);
    return false;
  }finally{ syncState.syncing=false; updateSyncIndicator(); }
}
async function processSyncQueue(){
  if(!navigator.onLine || !CLOUD || !syncQueue.length || syncState.syncing) { updateSyncIndicator(); return; }
  syncState.syncing=true; updateSyncIndicator();
  try{
    while(syncQueue.length && navigator.onLine){
      const entry=syncQueue[0]; let ok=false;
      try{
        if(entry.type==='products') await CLOUD.saveInventory(entry.payload.products, entry.payload.seq);
        if(entry.type==='sales') await CLOUD.saveSales(entry.payload);
        if(entry.type==='clients') await CLOUD.saveClients(entry.payload);
        if(entry.type==='settings') await CLOUD.saveSettings(entry.payload);
        ok=true; syncState.cloudAlive=true;
      }catch(err){ console.error('queue retry error',err); break; }
      if(ok){ syncQueue.shift(); await saveSyncQueue(); }
    }
  }finally{ syncState.syncing=false; updateSyncIndicator(); }
}
function localWriteError(type){ const e=new Error('No se pudo guardar '+type+' localmente'); e.localFailure=true; return e; }

function waitForCloud(){
  if(window.inhalaCloud) return Promise.resolve(window.inhalaCloud);
  return new Promise(resolve => window.addEventListener('inhala-cloud-ready', () => resolve(window.inhalaCloud), {once:true}));
}

async function loadData(){
  CLOUD = await waitForCloud();
  await CLOUD.waitForUser();
  const remote = await CLOUD.load();
  if(remote.inventoryExists){
    PRODUCTS = Array.isArray(remote.inventory.products) ? remote.inventory.products : [];
    SALES = Array.isArray(remote.sales && remote.sales.sales) ? remote.sales.sales : [];
    CLIENTS = Array.isArray(remote.clients && remote.clients.clients) ? remote.clients.clients : [];
    manualSkuSeq = remote.inventory.seq || 1;
    APP_SETTINGS = normalizeAppSettings(remote.settings && remote.settings.settings);
    await storageSet('inhala_settings', APP_SETTINGS);
    applyAppearance();
    if(!remote.settingsExists) await CLOUD.saveSettings(APP_SETTINGS);
    const weightMigrated = applyAutomaticWeightSales(PRODUCTS);
    if(weightMigrated) await persistProducts();
    return;
  }

  let prods = await storageGet('inhala_products');
  if(!prods){
    prods = [];
    await storageSet('inhala_products', prods);
  }
  let sales = await storageGet('inhala_sales');
  if(!sales){ sales = []; await storageSet('inhala_sales', sales); }
  let clients = await storageGet('inhala_clients');
  if(!clients){ clients = []; await storageSet('inhala_clients', clients); }
  let seq = await storageGet('inhala_seq');
  APP_SETTINGS = normalizeAppSettings(await storageGet('inhala_settings'));
  PRODUCTS = prods;
  SALES = sales;
  CLIENTS = clients;
  manualSkuSeq = seq || 1;
  const migratedWeightProducts = applyAutomaticWeightSales(PRODUCTS);
  applyAppearance();
  if(migratedWeightProducts) await storageSet('inhala_products', PRODUCTS);
  // Primer respaldo: si la nube no responde, los snapshots locales quedan en cola.
  await Promise.all([cloudSave('products',{products:PRODUCTS,seq:manualSkuSeq}), cloudSave('sales',SALES), cloudSave('clients',CLIENTS), cloudSave('settings',APP_SETTINGS)]);
}
async function persistProducts(){
  // Limpia el campo legado de códigos de barras al guardar el inventario.
  PRODUCTS.forEach(product=>{ if(Object.prototype.hasOwnProperty.call(product,'barcode')) delete product.barcode; });

  if(!localOk && !cloudOk){ toast('No se pudo guardar el inventario ni sincronizarlo. No cierres la aplicación.', true); throw localWriteError('el inventario'); }

}

function inventoryDuplicateKey(product){
  const normalize = value => String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  return normalize(product.provider)+'|'+normalize(product.name);
}
async function removeExactInventoryDuplicates(){
  const primaryByKey = new Map();
  const cleaned = [];
  let removed = 0;
  for(const product of PRODUCTS){
    const key = inventoryDuplicateKey(product);
    const primary = primaryByKey.get(key);
    if(!primary){ primaryByKey.set(key, product); cleaned.push(product); continue; }
    primary.stock = (Number(primary.stock)||0) + (Number(product.stock)||0);
    primary.minStock = Math.max(Number(primary.minStock)||0, Number(product.minStock)||0);
    if(!primary.image && product.image) primary.image = product.image;
    if(!primary.cost && product.cost) primary.cost = product.cost;
    if(!primary.price && product.price) primary.price = product.price;
    removed++;
  }
  if(!removed) return 0;
  PRODUCTS = cleaned;
  await persistProducts();
  return removed;
}
async function persistSettings(){
  APP_SETTINGS = normalizeAppSettings(APP_SETTINGS);
  const localOk=await storageSet('inhala_settings', APP_SETTINGS);
  applyAppearance();
  const cloudOk=await cloudSave('settings', APP_SETTINGS);
  if(!localOk && !cloudOk){ toast('No se pudo guardar la configuración ni sincronizarla. No cierres la aplicación.', true); throw localWriteError('la configuración'); }
  return cloudOk;
}
function startCloudSync(){
  if(!CLOUD || stopCloudSync) return;
  stopCloudSync = CLOUD.subscribe(data => {
    if(!Array.isArray(data.products)) return;
    syncState.cloudAlive=true;
    if(!syncQueue.some(x=>x.type==='products')) { PRODUCTS = data.products; manualSkuSeq = data.seq || 1; }
    updateSyncIndicator();
    if(document.getElementById('app').style.display !== 'none') setView(VIEW);
  }, data => {
    if(!Array.isArray(data.sales)) return;
    syncState.cloudAlive=true;
    if(!syncQueue.some(x=>x.type==='sales')) SALES = data.sales;
    updateSyncIndicator();
    if(VIEW==='dashboard' || VIEW==='historial') setView(VIEW);
  }, data => {
    if(!Array.isArray(data.clients)) return;
    syncState.cloudAlive=true;
    if(!syncQueue.some(x=>x.type==='clients')) CLIENTS = data.clients;
    updateSyncIndicator();
    if(VIEW==='clientes' || VIEW==='venta') setView(VIEW);
  }, data => {
    syncState.cloudAlive=true;
    if(!syncQueue.some(x=>x.type==='settings')) APP_SETTINGS = normalizeAppSettings(data.settings);
    applyAppearance();
    updateSyncIndicator();
    if(VIEW==='configuracion') renderConfiguracion();
  });
}

// Búsqueda tolerante: ignora acentos, plural/singular y nombres comerciales parecidos.
// Ej.: "brava", "barra" o "barritas brava" encuentra "Barra Brava".
function normalizeSearchText(value){
  return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
    .replace(/[^a-z0-9]+/g,' ').trim();
}
function normalizeSearchToken(token){
  const aliases = { barra:'barra', barras:'barra', barrita:'barra', barritas:'barra',
    bravas:'brava', proteicas:'proteica', almendras:'almendra', arandanos:'arandano',
    chocolates:'chocolate', frutos:'fruto', semillas:'semilla', galletitas:'galletita' };
  const t = normalizeSearchText(token);
  if(aliases[t]) return aliases[t];
  return t.replace(/(?:es|s)$/,'');
}
function productSearchScore(product, query){
  // Solo busca por descripción (nombre del producto), no por SKU/proveedor/marca/categoría.
  const text = normalizeSearchText(product.name);
  const phrase = normalizeSearchText(query);
  if(!phrase) return 1;
  if(text.includes(phrase)) return 100;
  const terms = phrase.split(' ').map(normalizeSearchToken).filter(t=>t.length>=2);
  if(!terms.length) return 0;
  const words = text.split(' ').map(normalizeSearchToken);
  // Exige que TODOS los términos buscados coincidan con alguna palabra del producto
  // (match exacto, o por prefijo si el término tiene 3+ letras). Se eliminó el
  // substring bidireccional (word.includes(term) || term.includes(word)) que
  // provocaba coincidencias con productos sin relación alguna.
  const allMatch = terms.every(term =>
    words.some(word => word===term || (term.length>=3 && word.startsWith(term)))
  );
  if(!allMatch) return 0;
  return terms.length * 10 + 20;
}
function searchProducts(products, query){
  const q = String(query||'').trim();
  if(!q) return products.slice();
  return products.map(product=>({product, score:productSearchScore(product,q)}))
    .filter(item=>item.score>0)
    .sort((a,b)=>b.score-a.score || a.product.name.localeCompare(b.product.name))
    .map(item=>item.product);
}

function filteredProducts(){
  let list = PRODUCTS;
  if(pf.search.trim()){
    list = searchProducts(list, pf.search);
  }
  if(pf.category!=='all') list = list.filter(p=>p.category===pf.category);
  if(pf.brand!=='all') list = list.filter(p=>(p.brand||'Sin marca')===pf.brand);
  if(pf.status==='low') list = list.filter(p=>p.stock>0 && p.stock<=p.minStock);
  if(pf.status==='out') list = list.filter(p=>p.stock<=0);
  if(pf.status==='ok') list = list.filter(p=>p.stock>p.minStock);
  const dir = pf.sortDir==='asc'?1:-1;
  list = list.slice().sort((a,b)=>{
    let va=a[pf.sortKey], vb=b[pf.sortKey];
    if(typeof va==='string'){ va=va.toLowerCase(); vb=vb.toLowerCase(); }
    if(va<vb) return -1*dir; if(va>vb) return 1*dir; return 0;
  });
  return list;
}

// Agrupa presentaciones del mismo producto, por ejemplo "Aceite 10 ml x 1u"
// y "Aceite 10 ml x 12u", sin mezclar sus SKU, precios ni stocks.
function productPresentation(product){
  const name=String(product.name||'').trim();
  const match=name.match(/(?:\s*[·•\-–]?\s*)x\s*(\d+)\s*(?:u|un(?:idad(?:es)?)?|unid(?:ades)?|pack)?\s*$/i);
  if(!match) return {baseName:name, pack:1, label:'Unidad'};
  const pack=Math.max(1,Number(match[1])||1);
  return {baseName:name.slice(0,match.index).trim(), pack, label:pack===1?'Unidad':`Pack x${pack}`};
}
function groupedProducts(products){
  const groups=new Map();
  products.forEach(product=>{
    const presentation=productPresentation(product);
    const key=[normalizedText(presentation.baseName), normalizedText(product.brand||''), normalizedText(product.category||'')].join('|');
    if(!groups.has(key)) groups.set(key,{key, baseName:presentation.baseName, items:[]});
    groups.get(key).items.push({...product, presentation});
  });
  return [...groups.values()].map(group=>{
    group.items.sort((a,b)=>a.presentation.pack-b.presentation.pack || a.sku.localeCompare(b.sku));
    group.primary=group.items[0];
    return group;
  });
}

          ${pageItems.length? pageItems.map(groupHtml).join('') : `<tr><td colspan="11"><div class="empty">${ICONS.empty}<div class="t">No se encontraron productos</div>Probá con otra búsqueda o filtro.</div></td></tr>`}
        </tbody>

        <span>Página ${pf.page} de ${totalPages} — mostrando ${pageItems.length} de ${fmtInt(all.length)} productos</span>

          <button class="btn secondary sm" id="pNext" ${pf.page>=totalPages?'disabled':''}>Siguiente</button>
        </div>
      </div>
    </div>
  `;

  function groupHtml(group){
    return group.items.map((p,index)=>rowHtml(p, group, index)).join('');
  }
  function rowHtml(p, group, index){
    const margin = p.cost>0 ? ((p.price-p.cost)/p.price*100) : null;
    const isPrimary=index===0, variants=group.items.length;
    return `<tr data-sku="${esc(p.sku)}" style="${isPrimary&&variants>1?'border-top:2px solid var(--green-200);':''}">

      <td class="muted num">${esc(p.sku)}</td>
      <td><div class="strong ${isPrimary?'editable-cell':''}" ${isPrimary?'data-field="name"':''} style="font-size:13px; display:flex; align-items:center; gap:6px;">${isPrimary?esc(group.baseName):`↳ ${esc(p.presentation.label)}`}${isPrimary&&variants>1?`<span class="badge dot" style="background:var(--green-100); color:var(--green-700);">${variants} presentaciones</span>`:''}${p.soldByWeight?'<span class="badge dot" style="background:var(--green-100); color:var(--green-700);">A Granel</span>':''}</div>${isPrimary?`<div class="muted editable-cell" data-field="brand" style="font-size:11px;">${esc(p.brand||'Sin marca')}</div><div class="muted editable-cell" data-field="provider" style="font-size:11px;">${esc(p.provider||'Sin proveedor')}</div>`:`<div class="muted" style="font-size:11px;">${esc(p.name)}</div>`}</td>
      <td class="editable-cell" data-field="category">${categoryChip(p.category)}</td>
      <td class="num editable-cell" data-field="cost">${p.cost>0?fmt(p.cost)+(p.soldByWeight?'/kg':''):'<span class="muted">—</span>'}</td>
      <td class="num editable-cell strong" data-field="price">${fmt(p.price)}${p.soldByWeight?'/kg':''}</td>
      <td class="num">${margin!==null? margin.toFixed(1)+'%' : '<span class="muted">—</span>'}</td>
      <td class="num editable-cell" data-field="stock">${p.soldByWeight?formatWeightKg(p.stock):p.stock}</td>
      <td>${stockBadge(p)}</td>
      <td style="text-align:right; white-space:nowrap;">
        <button class="icon-btn" data-edit="${esc(p.sku)}" title="Editar">${ICONS.edit}</button>
        <button class="icon-btn" data-del="${esc(p.sku)}" title="Eliminar">${ICONS.trash}</button>

  }

  $('#pSearch').oninput = e => { pf.search = e.target.value; pf.page=1; withFocusPreserved(renderProductos); };
  $all('[data-status]').forEach(b => b.onclick = () => { pf.status = b.dataset.status; pf.page=1; renderProductos(); });
  $('#pCategoryFilter').onchange = e => { pf.category = e.target.value; pf.page=1; renderProductos(); };
  $('#pBrandFilter').onchange = e => { pf.brand = e.target.value; pf.page=1; renderProductos(); };
  if($('#pClearFilters')) $('#pClearFilters').onclick = () => { pf.category='all'; pf.brand='all'; pf.page=1; renderProductos(); };
  $('#btnNewProduct').onclick = () => openProductModal(null);

  $('#btnImportPrices').onclick = openPriceImportModal;
  $('#btnBulkPrice').onclick = () => openBulkPriceModal();
  if($('#btnBulkFromSelection')) $('#btnBulkFromSelection').onclick = () => openBulkPriceModal('sel');
  $('#btnBulkEdit').onclick = () => openBulkEditModal();
  if($('#btnBulkEditFromSelection')) $('#btnBulkEditFromSelection').onclick = () => openBulkEditModal('sel');
  if($('#btnClearSelection')) $('#btnClearSelection').onclick = () => { selectedSkus.clear(); renderProductos(); };
  $('#pPrev').onclick = () => { pf.page--; renderProductos(); };
  $('#pNext').onclick = () => { pf.page++; renderProductos(); };
  $all('.sortable').forEach(th => th.onclick = () => {

    if(pf.sortKey===k) pf.sortDir = pf.sortDir==='asc'?'desc':'asc'; else { pf.sortKey=k; pf.sortDir='asc'; }
    renderProductos();
  });
  $all('[data-edit]').forEach(b => b.onclick = () => openProductModal(b.dataset.edit));
  $all('[data-del]').forEach(b => b.onclick = () => confirmDeleteProduct(b.dataset.del));
  $all('.editable-cell').forEach(td => td.onclick = () => startInlineEdit(td));
  $('#selectAllPage').onchange = e => {
    if(e.target.checked) pageSkus.forEach(s=>selectedSkus.add(s));
    else pageSkus.forEach(s=>selectedSkus.delete(s));
    renderProductos();
  };
  $all('.row-select').forEach(cb => cb.onchange = () => {
    const sku = cb.dataset.sel;
    if(cb.checked) selectedSkus.add(sku); else selectedSkus.delete(sku);
    renderProductos();
  });
}

function startInlineEdit(td){
  if(td.querySelector('input, select')) return;
  const tr = td.closest('tr');
  const sku = tr.dataset.sku;
  const field = td.dataset.field;
  const p = PRODUCTS.find(x=>x.sku===sku);
  if(!p) return;
  const current = p[field];
  const numeric = ['cost','price','stock','minStock'].includes(field);
  const isWeightQty = (field==='stock' || field==='minStock') && p.soldByWeight;
  if(field==='category'){
    const cats = Array.from(new Set([...getCategories(), current])).filter(Boolean).sort();
    td.innerHTML = `<select class="cell-edit" style="min-width:145px;">${cats.map(c=>`<option value="${esc(c)}" ${c===current?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
  } else {
    td.innerHTML = `<input class="cell-edit" type="${numeric?'number':'text'}" ${numeric?`step="${isWeightQty?'0.001':'0.01'}" min="0"`:''} value="${esc(current)}">`;
  }
  const input = td.querySelector('input, select');
  input.focus(); if(input.select) input.select();
  const commit = async () => {
    let val;
    if(numeric){
      val = parseFloat(input.value);
      if(isNaN(val) || val<0) val = 0;
      if((field==='stock' || field==='minStock') && !isWeightQty) val = Math.round(val);
      if(isWeightQty) val = Math.round(val*1000)/1000;
    } else {
      val = input.value.trim();
      if(!val) val = field==='category' ? 'Otros' : (field==='provider' ? 'Sin proveedor' : (field==='brand' ? 'Sin marca' : p[field]));
    }
    p[field] = val;
    await persistProducts();
    renderProductos();
    if(VIEW==='dashboard') renderDashboard();
  };
  input.onblur = commit;
  input.onchange = () => { if(field==='category') input.blur(); };
  input.onkeydown = e => { if(e.key==='Enter') input.blur(); if(e.key==='Escape'){ renderProductos(); } };
}

  const p = PRODUCTS.find(x=>x.sku===sku);

    <div class="modal-body">
      <p style="margin:0; font-size:13.5px; line-height:1.5;">¿Seguro que querés eliminar <b>${esc(p.name)}</b> (SKU ${esc(p.sku)}) del catálogo? Esta acción no se puede deshacer.</p>

    <div class="modal-foot">
      <button class="btn secondary" data-close>Cancelar</button>
      <button class="btn danger" id="confirmDel">${ICONS.trash} Eliminar</button>

    PRODUCTS = PRODUCTS.filter(x=>x.sku!==sku);

      <div>
        <label class="field-label">¿Cómo se vende este producto?</label>

    const provider = $('#fProvider').value.trim();

    const soldByWeight = $('input[name="fUnit"]:checked').value === 'kg' || productIndicatesWeightSale({name});
    const cost = Math.max(0, parseFloat($('#fCost').value)||0);
    const price = Math.max(0, parseFloat($('#fPrice').value)||0);
    const stock = soldByWeight ? Math.max(0, parseFloat($('#fStock').value)||0) : Math.max(0, Math.round(parseFloat($('#fStock').value)||0));

    if(editing){
      Object.assign(savedProduct, {name, category, brand, provider, image, cost, price, stock, minStock, soldByWeight});
    } else {
      const newSku = 'M-' + String(manualSkuSeq).padStart(4,'0');
      manualSkuSeq++;
      await persistSeq();
      PRODUCTS.unshift({sku:newSku, name, category, brand, provider, image, cost, price, stock, minStock, soldByWeight});
    }
    await persistProducts();
    closeModal();
    toast(editing?'Producto actualizado':'Producto creado');
    renderProductos();
    if(VIEW==='dashboard') renderDashboard();
  };
}

/* ---------- Ajuste de precios por lote (categoría / selección / filtro / todo) ---------- */
function scopeProducts(scope, catValue){
  if(scope==='sel') return PRODUCTS.filter(p=>selectedSkus.has(p.sku));
  if(scope==='cat') return PRODUCTS.filter(p=>p.category===catValue);
  if(scope==='filtered') return filteredProducts();
  return PRODUCTS.slice();
}

function openBulkPriceModal(defaultScope){
  const cats = getCategories();
  const filteredCount = filteredProducts().length;
  const initialScope = defaultScope || (selectedSkus.size>0 ? 'sel' : 'filtered');
  const initialCat = cats[0] || '';

  showModal(`
    <div class="modal-head"><h3>${ICONS.layers} Ajustar precios por lote</h3><button class="icon-btn" data-close>${ICONS.close}</button></div>
    <div class="modal-body">
      <div>
        <label class="field-label">¿A qué productos aplicar el ajuste?</label>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:6px;">
          <label style="display:flex; align-items:center; gap:8px; font-size:13px;">
            <input type="radio" name="scope" value="sel" ${initialScope==='sel'?'checked':''} ${selectedSkus.size===0?'disabled':''}>
            Productos seleccionados en la tabla <span class="muted">(${fmtInt(selectedSkus.size)})</span>
          </label>
          <label style="display:flex; align-items:center; gap:8px; font-size:13px;">
            <input type="radio" name="scope" value="cat" ${initialScope==='cat'?'checked':''}>
            Toda una categoría:
            <select id="scopeCatSelect" style="flex:1;" ${cats.length===0?'disabled':''}>
              ${cats.map(c=>`<option value="${esc(c)}">${esc(c)} (${fmtInt(PRODUCTS.filter(p=>p.category===c).length)})</option>`).join('')}
            </select>
          </label>
          <label style="display:flex; align-items:center; gap:8px; font-size:13px;">
            <input type="radio" name="scope" value="filtered" ${initialScope==='filtered'?'checked':''}>
            Resultados filtrados actualmente en la tabla <span class="muted">(${fmtInt(filteredCount)})</span>
          </label>
          <label style="display:flex; align-items:center; gap:8px; font-size:13px;">
            <input type="radio" name="scope" value="all" ${initialScope==='all'?'checked':''}>
            Todo el catálogo <span class="muted">(${fmtInt(PRODUCTS.length)})</span>
          </label>
        </div>
      </div>

      <div class="field-row">
        <div>
          <label class="field-label">Aplicar a</label>
          <select id="bulkField" style="width:100%;">
            <option value="price">Precio de venta</option>
            <option value="cost">Precio de costo</option>
            <option value="both">Ambos</option>
          </select>
        </div>
        <div>
          <label class="field-label">Acción</label>
          <select id="bulkDir" style="width:100%;">
            <option value="inc">Aumentar</option>
            <option value="dec">Disminuir</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div>
          <label class="field-label">Modo</label>
          <select id="bulkMode" style="width:100%;">
            <option value="pct">Porcentaje (%)</option>
            <option value="fixed">Monto fijo ($)</option>
          </select>
        </div>
        <div>
          <label class="field-label" id="bulkValueLabel">Valor (%)</label>
          <input id="bulkValue" type="number" min="0" step="0.01" style="width:100%;" placeholder="Ej: 10">
        </div>
      </div>

      <div class="hint" id="bulkPreview" style="background:var(--green-50); border:1px solid var(--green-100); border-radius:8px; padding:10px 12px; color:var(--ink);"></div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" data-close>Cancelar</button>
      <button class="btn" id="applyBulk">${ICONS.check} Aplicar ajuste</button>
    </div>
  `);

  const getScope = () => $('input[name="scope"]:checked') ? $('input[name="scope"]:checked').value : 'filtered';
  const updatePreview = () => {
    const scope = getScope();
    const catVal = $('#scopeCatSelect') ? $('#scopeCatSelect').value : '';
    const list = scopeProducts(scope, catVal);
    const mode = $('#bulkMode').value;
    $('#bulkValueLabel').textContent = 'Valor (' + (mode==='pct'?'%':'$') + ')';
    const val = parseFloat($('#bulkValue').value);
    const dirLabel = $('#bulkDir').value==='inc' ? 'aumentado' : 'disminuido';
    const fieldLabel = $('#bulkField').value==='both' ? 'costo y venta' : ($('#bulkField').value==='cost'?'costo':'venta');
    if(!list.length){
      $('#bulkPreview').textContent = 'No hay productos en este grupo.';
    } else if(isNaN(val) || val<=0){
      $('#bulkPreview').textContent = `Se va a modificar el precio de ${fieldLabel} de ${fmtInt(list.length)} producto${list.length===1?'':'s'}. Ingresá un valor mayor a 0.`;
    } else {
      $('#bulkPreview').textContent = `El precio de ${fieldLabel} de ${fmtInt(list.length)} producto${list.length===1?'':'s'} va a ser ${dirLabel} en ${mode==='pct'?val+'%':fmt(val)}.`;
    }
  };
  $all('input[name="scope"]').forEach(r => r.onchange = updatePreview);
  if($('#scopeCatSelect')) $('#scopeCatSelect').onchange = updatePreview;
  $('#bulkField').onchange = updatePreview;
  $('#bulkDir').onchange = updatePreview;
  $('#bulkMode').onchange = updatePreview;
  $('#bulkValue').oninput = updatePreview;
  updatePreview();

  $('#applyBulk').onclick = async () => {
    const scope = getScope();
    const catVal = $('#scopeCatSelect') ? $('#scopeCatSelect').value : '';
    const list = scopeProducts(scope, catVal);
    const field = $('#bulkField').value; // price | cost | both
    const dir = $('#bulkDir').value;      // inc | dec
    const mode = $('#bulkMode').value;    // pct | fixed
    const val = parseFloat($('#bulkValue').value);
    if(!list.length){ toast('No hay productos en ese grupo', true); return; }
    if(isNaN(val) || val<=0){ toast('Ingresá un valor mayor a 0', true); return; }

    const fields = field==='both' ? ['cost','price'] : [field];
    const skuSet = new Set(list.map(p=>p.sku));
    PRODUCTS.forEach(p => {
      if(!skuSet.has(p.sku)) return;
      fields.forEach(f => {
        const cur = p[f];
        const delta = mode==='pct' ? cur*(val/100) : val;
        let next = dir==='inc' ? cur+delta : cur-delta;
        next = Math.max(0, Math.round(next*100)/100);
        p[f] = next;
      });
    });
    await persistProducts();
    closeModal();
    toast(`Precio actualizado en ${fmtInt(list.length)} producto${list.length===1?'':'s'}`);
    renderProductos();
    if(VIEW==='dashboard') renderDashboard();
  };
}

/* ---------- Importación y exportación de inventario ---------- */
function exportInventory(){
  if(!window.XLSX){ toast('No se pudo preparar la exportación. Recargá la aplicación e intentá nuevamente.', true); return; }
  const rows = PRODUCTS.map(p => ({
    SKU:p.sku, 'Nombre del producto':p.name, Categoría:p.category||'', Marca:p.brand||'', Proveedor:p.provider||'',
    'Precio de costo':Number(p.cost)||0, 'Precio de venta':Number(p.price)||0, 'Stock disponible':Number(p.stock)||0,
    'Alerta de stock bajo':Number(p.minStock)||0, 'Forma de venta':p.soldByWeight?'A granel, por peso (kg)':'Por unidad', 'URL de imagen':p.image||''
  }));
  const book = XLSX.utils.book_new();
  const sheet = XLSX.utils.json_to_sheet(rows);
  XLSX.utils.book_append_sheet(book, sheet, 'Inventario');
  XLSX.writeFile(book, `inventario-inhala-${new Date().toISOString().slice(0,10)}.xlsx`);
}
function inventoryValue(row, keys){
  const clean={}; Object.keys(row||{}).forEach(k=>clean[normalizedText(k)]=row[k]);
  for(const key of keys){ const value=clean[normalizedText(key)]; if(value!==undefined && String(value).trim()!=='') return value; }
  return undefined;
}
function stockValue(value){
  const number = moneyValue(value); return isNaN(number) ? null : Math.max(0, number);
}
function rowsToInventoryChanges(rows){
  const updates=[], creates=[], ignored=[];
  const takenSkus=new Set(PRODUCTS.map(p=>normalizedText(p.sku)));
  rows.forEach((row,index)=>{
    const skuRaw=inventoryValue(row,['sku','sku variante','codigo','código','codigo producto','código de producto','cod producto']);
    const nameRaw=inventoryValue(row,['producto','producto principal','nombre','nombre del producto','descripcion','descripción','articulo','artículo']);
    const sku=String(skuRaw||'').trim(), name=String(nameRaw||'').trim();
    const variantRaw=inventoryValue(row,['variante','presentacion','presentación','pack','formato']);
    const variant=String(variantRaw||'').trim();
    const isUnitVariant=/^(unidad|por unidad|unitario|x\s*1|1\s*unidad)$/i.test(variant);
    const displayName=name && variant && !isUnitVariant && !normalizedText(name).includes(normalizedText(variant)) ? `${name} · ${variant}` : name;
    // Si la fila tiene SKU, ese identificador manda: evita que un pack nuevo
    // reemplace al producto por unidad cuando ambos comparten nombre base.
    const current=sku ? productLookup(sku,true) : productLookup(name,false);
    if(!current && !name){ ignored.push(index+2); return; }
    const category=inventoryValue(row,['categoria','categoría']);
    const brand=inventoryValue(row,['marca']);
    const provider=inventoryValue(row,['proveedor','provider']);
    const image=inventoryValue(row,['imagen','image','url imagen','url de imagen','url de la imagen','link imagen','link de imagen','foto','url foto']);
    const unit=inventoryValue(row,['unidad','tipo de venta','forma de venta','se vende por','se vende por peso','a granel por peso (kg)']);
    const item={
      sku:current ? current.sku : sku,
      name:displayName || (current&&current.name), category, brand, provider, image,
      cost:stockValue(inventoryValue(row,['precio de costo','costo','costo compra'])),
      price:stockValue(inventoryValue(row,['precio de venta','precio pack','venta','precio','precio lista','pvp'])),
      stock:stockValue(inventoryValue(row,['stock','stock disponible','cantidad','existencia'])),
      minStock:stockValue(inventoryValue(row,['stock minimo','stock mínimo','min stock','alerta stock','alerta de stock bajo'])),
      soldByWeight:unit===undefined ? null : /^(kg|kilo|kilogramo|granel|a granel|por peso|a granel,? por peso \(kg\)|si|sí|true|1)$/i.test(String(unit).trim())
    };
    if(current) updates.push(item);
    else if(!sku || takenSkus.has(normalizedText(sku))) ignored.push(index+2);
    else { creates.push(item); takenSkus.add(normalizedText(sku)); }
  });
  const uniqueUpdates=new Map(); updates.forEach(item=>uniqueUpdates.set(item.sku,item));
  return {updates:[...uniqueUpdates.values()], creates, ignored};
}

function selectInventorySheet(workbook){
  const names=workbook.SheetNames || [];
  const byName=new Map(names.map(name=>[normalizedText(name),name]));
  const priority=['inventario original','inventario completo','inventario base','inventario','variantes'];
  for(const wanted of priority){ if(byName.has(wanted)) return byName.get(wanted); }
  return names[0];
}
function importInventorySheet(file){
  const reader=new FileReader();
  reader.onerror=()=>{ const state=$('#inventoryImportState'); if(state){state.style.display='block';state.textContent='No se pudo leer el archivo.';} };
  reader.onload=()=>{
    try{
      if(!window.XLSX) throw new Error('La librería para leer planillas no está disponible. Recargá la aplicación e intentá nuevamente.');
      const workbook=XLSX.read(reader.result,{type:'array'});
      const sheetName=selectInventorySheet(workbook);
      if(!sheetName) throw new Error('El archivo no contiene hojas para importar.');
      const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{defval:''});
      previewInventoryChanges(rowsToInventoryChanges(rows), `${file.name} · hoja ${sheetName}`);
    }catch(error){ const state=$('#inventoryImportState'); if(state){state.style.display='block';state.style.background='var(--red-bg)';state.style.borderColor='#efc0bb';state.textContent=error.message||'El archivo no tiene un formato válido.';} }
  };
  reader.readAsArrayBuffer(file);
}

/* ---------- Importación de precios (Excel / CSV / captura) ---------- */
function normalizedText(value){
  return String(value==null?'':value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
}
function moneyValue(value){
  if(typeof value==='number') return Number.isFinite(value) ? value : NaN;
  let s = String(value==null?'':value).trim().replace(/\$/g,'').replace(/\s/g,'');
  if(!s) return NaN;
  if(s.includes('.') && s.includes(',')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',', '.') : s.replace(/,/g,'');
  else if(s.includes(',')) s = s.replace(',', '.');
  return Number(s.replace(/[^0-9.-]/g,''));
}
function productLookup(value, isSku){
  const v = normalizedText(value);
  if(!v) return null;
  if(isSku) return PRODUCTS.find(p=>normalizedText(p.sku)===v) || null;
  return PRODUCTS.find(p=>normalizedText(p.name)===v) || null;
}
function rowsToUpdates(rows){
  const updates = [], candidates = [], ignored = [];
  rows.forEach((row, index) => {
    const clean = {};
    Object.keys(row||{}).forEach(k=> clean[normalizedText(k)] = row[k]);
    const sku = clean.sku ?? clean.codigo ?? clean['cod producto'] ?? clean['codigo producto'];
    const name = clean.producto ?? clean.nombre ?? clean.descripcion ?? clean.articulo;
    const price = clean['precio venta'] ?? clean.venta ?? clean.precio ?? clean['precio lista'] ?? clean.pvp;
    const cost = clean.costo ?? clean['precio costo'] ?? clean['costo compra'];
    const p = productLookup(sku, true) || productLookup(name, false);
    const sale = moneyValue(price), purchase = moneyValue(cost);
    if(!p || (isNaN(sale) && isNaN(purchase))){
      // Una captura de tienda suele traer un nombre distinto al del inventario.
      // Se conserva como candidato para que se asigne manualmente, sin actualizar productos por error.
      if(name && (!isNaN(sale) || !isNaN(purchase))) candidates.push({sourceName:String(name), price:isNaN(sale)?null:Math.max(0,sale), cost:isNaN(purchase)?null:Math.max(0,purchase)});
      else ignored.push(index+2);
      return;
    }
    updates.push({sku:p.sku, name:p.name, price:isNaN(sale)?null:Math.max(0,sale), cost:isNaN(purchase)?null:Math.max(0,purchase)});
  });
  const unique = new Map(); updates.forEach(u=>unique.set(u.sku,u));
  return {updates:[...unique.values()], candidates, ignored};
}

function importPriceSheet(file){
  const lower = file.name.toLowerCase();
  const reader = new FileReader();
  reader.onerror = () => showImportState('No se pudo leer el archivo.', true);
  reader.onload = () => {
    try{
      let rows;
      if(lower.endsWith('.csv')){
        const text = String(reader.result||''); const lines = text.split(/\r?\n/).filter(Boolean); const sep = (lines[0]||'').includes(';') ? ';' : ',';
        const headers = (lines.shift()||'').split(sep).map(s=>s.replace(/^"|"$/g,'').trim());
        rows = lines.map(line=>{ const cells=line.split(sep).map(s=>s.replace(/^"|"$/g,'').trim()); return Object.fromEntries(headers.map((h,i)=>[h,cells[i]??''])); });
      } else {
        if(!window.XLSX) throw new Error('La librería para leer Excel no está disponible. Verificá la conexión y volvé a abrir la aplicación.');
        const wb = XLSX.read(reader.result, {type:'array'}); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
      }
      const result = rowsToUpdates(rows); previewPriceUpdates(result, file.name);
    }catch(err){ showImportState(err.message || 'El archivo no tiene un formato válido.', true); }
  };
  if(lower.endsWith('.csv')) reader.readAsText(file, 'UTF-8'); else reader.readAsArrayBuffer(file);
}
function loadOcr(){
  if(window.Tesseract) return Promise.resolve();
  return new Promise((resolve,reject)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'; s.onload=resolve; s.onerror=()=>reject(new Error('No se pudo cargar el lector de imágenes.')); document.head.appendChild(s); });
}
async function importPriceImage(file){
  showImportState('Leyendo la captura. Esto puede tardar unos segundos.', false);
  try{
    await loadOcr();
    const out = await Tesseract.recognize(file, 'spa');
    const lines=out.data.text.split(/\r?\n/).map(line=>line.replace(/\s+/g,' ').trim()).filter(Boolean);
    const rows=[], recentNames=[];
    lines.forEach(line=>{
      const prices=line.match(/\$?\s*\d{1,3}(?:[.\s]\d{3})*(?:,\d{1,2})?|\$?\s*\d+(?:\.\d{1,2})?/g) || [];
      const price=prices.length ? prices[prices.length-1] : '';
      const nameOnLine=line.replace(/\$?\s*\d{1,3}(?:[.\s]\d{3})*(?:,\d{1,2})?|\$?\s*\d+(?:\.\d{1,2})?/g,'').replace(/[|·]/g,' ').trim();
      if(price && moneyValue(price)===moneyValue(price)){
        const name=nameOnLine || recentNames[recentNames.length-1] || '';
        if(name) rows.push({Producto:name, 'Precio de venta':price});
      } else if(line.replace(/[^a-záéíóúüñ]/gi,'').length>=3) recentNames.push(line);
    });
    previewPriceUpdates(rowsToUpdates(rows), file.name);
  }catch(err){ showImportState(err.message || 'No se pudo leer la imagen.', true); }
}
