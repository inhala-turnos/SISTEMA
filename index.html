    <div class="modal-foot"><button class="btn secondary" data-close>Cancelar</button><button class="btn" id="confirmWeight">${ICONS.check} Agregar al carrito</button></div>
  `);
  const input = $('#fWeightQty');
  const preview = $('#weightPreview');
  const updatePreview = () => {
    const kg = parseWeightToKg(input.value);
    if(kg==null || kg<=0){ preview.textContent = ''; return; }
    preview.textContent = formatWeightKg(kg) + ' · Subtotal: ' + fmt(roundMoney(p.price*kg));
  };
  input.oninput = updatePreview;
  input.focus();
  updatePreview();
  const commit = () => {
    const kg = parseWeightToKg(input.value);
    if(kg==null || kg<=0){ toast('Ingresá una cantidad válida, ej: 150, 500g o 2,5kg', true); return; }
    if(p.stock>0 && kg>p.stock) toast('Atención: pediste más de lo que figura en stock ('+formatWeightKg(p.stock)+'). La venta se registra igual.');
    else if(p.stock<=0) toast('Atención: "'+p.name+'" está sin stock cargado. La venta se registra igual.');
    if(existing){ existing.qty = kg; }
    else { cart.push({sku:p.sku, name:p.name, price:p.price, cost:p.cost, stock:p.stock, image:p.image||'', qty:kg, unit:'kg'}); }
    closeModal();
    renderCart();
  };
  $('#confirmWeight').onclick = commit;
  input.onkeydown = e => { if(e.key==='Enter') commit(); };
}

/* ---------- 2. Pagos mixtos ---------- */
function cartTotal(){ return cart.reduce((a,c)=>a+roundMoney((Number(c.price)||0)*(Number(c.qty)||0)),0); }
function paymentMethodLabel(method){ return ({efectivo:'Efectivo',tarjeta:'Tarjeta',transferencia:'Transferencia'})[method] || method; }
function renderPaymentRows(){
  const box=$('#paymentRows'); if(!box) return;
  const total=cartTotal();
  // Con un solo método de pago, el importe sigue al total automáticamente,
  // salvo que el usuario ya lo haya editado a mano (p.auto === false).
  if(paymentDraft.length===1 && paymentDraft[0].auto!==false) paymentDraft[0].amount=total;
  box.innerHTML=paymentDraft.map((p,i)=>`<div class="payment-row"><select data-payment-method="${i}"><option value="efectivo" ${p.method==='efectivo'?'selected':''}>Efectivo</option><option value="tarjeta" ${p.method==='tarjeta'?'selected':''}>Tarjeta</option><option value="transferencia" ${p.method==='transferencia'?'selected':''}>Transferencia</option></select><input data-payment-amount="${i}" type="number" min="0" step="0.01" value="${p.amount||''}" placeholder="Importe"><button class="icon-btn" data-payment-remove="${i}" title="Quitar método" ${paymentDraft.length===1?'disabled':''}>${ICONS.close}</button></div>`).join('');
  const paid=paymentDraft.reduce((a,p)=>a+(Number(p.amount)||0),0), diff=total-paid;
  $('#paymentTotal').innerHTML=`Total: <b>${fmt(total)}</b> · Ingresado: <b>${fmt(paid)}</b>${Math.abs(diff)>.009 ? ` · <span style="color:${diff>0?'var(--amber)':'var(--red)'}">${diff>0?'Faltan ':'Excede '}${fmt(Math.abs(diff))}</span>` : ' · <span style="color:var(--green-700);font-weight:700;">Pago completo</span>'}`;
  $all('[data-payment-method]').forEach(el=>el.onchange=()=>{ paymentDraft[+el.dataset.paymentMethod].method=el.value; });
  $all('[data-payment-amount]').forEach(el=>el.oninput=()=>{ const i=+el.dataset.paymentAmount; paymentDraft[i].amount=Math.max(0,parseFloat(el.value)||0); paymentDraft[i].auto=false; renderPaymentRows(); });
  $all('[data-payment-remove]').forEach(el=>el.onclick=()=>{ paymentDraft.splice(+el.dataset.paymentRemove,1); renderPaymentRows(); });
}

function renderCart(){
  const box = $('#cartItems');
  const totals = $('#cartTotals');
  if(!box) return;
  box.innerHTML = cart.length ? cart.map(c => { const product=PRODUCTS.find(p=>p.sku===c.sku)||c; const isWeight=c.unit==='kg'; return `
    <div class="cart-item" data-sku="${esc(c.sku)}">
      <div class="cart-product">${productThumb(product, 42)}<div class="name">${esc(c.name)}<div class="muted" style="font-size:11px; font-weight:400;">SKU ${esc(c.sku)}</div></div></div>
      <div class="cart-unit">${formatUnitPrice(c)}</div>
      ${isWeight ? `
      <div class="weight-ctrl">
        <input value="${formatWeightKg(c.qty).replace(' ','')}" data-weightinput>
        <div class="hint muted">${formatWeightKg(c.qty)}</div>
      </div>` : `
      <div class="qty-ctrl">
        <button data-qty="-1">${ICONS.minus}</button>
        <input value="${c.qty}" data-qtyinput>
        <button data-qty="1">${ICONS.plus}</button>
      </div>`}
      <div class="strong num cart-subtotal">${fmt(roundMoney(c.price*c.qty))}</div>
      <button class="icon-btn" data-remove>${ICONS.close}</button>
    </div>
  `; }).join('') : `<div class="empty" style="padding:30px 8px;">${ICONS.cart}<div class="t">El carrito está vacío</div>Buscá un producto a la izquierda para agregarlo.</div>`;

  const total = cart.reduce((a,c)=>a+roundMoney(c.price*c.qty),0);
  const totalCost = cart.reduce((a,c)=>a+c.cost*c.qty,0);
  const units = cart.reduce((a,c)=>a+(c.unit==='kg'?0:c.qty),0);
  const weightItems = cart.filter(c=>c.unit==='kg');
  const pill = $('#cartPill');
  if(pill){
    const parts = [];
    if(units>0) parts.push(`${units} ${units===1?'unidad':'unidades'}`);
    if(weightItems.length) parts.push(weightItems.map(c=>formatWeightKg(c.qty)).join(' + '));
    pill.textContent = `${cart.length} producto${cart.length===1?'':'s'} · ${parts.join(' · ') || '0 unidades'}`;
  }
  totals.innerHTML = cart.length ? `
    <div class="cart-total-row"><span class="muted">Unidades totales</span><span class="strong">${units}${weightItems.length?' + '+weightItems.map(c=>formatWeightKg(c.qty)).join(' + '):''}</span></div>
    <div class="cart-total-row"><span class="muted">Subtotal</span><span class="strong">${fmt(total)}</span></div>
    <div class="cart-total-row grand"><span>Total</span><span>${fmt(total)}</span></div>
  ` : '';
  renderPaymentRows();

  // Los botones +/- y el stock disponible son solo orientativos: no bloquean la venta.
  // El stock puede llegar a 0 o negativo; se sincroniza cuando se recargue el stock real.
  $all('[data-qty]', box).forEach(b => b.onclick = () => {
    const sku = b.closest('.cart-item').dataset.sku;
    const item = cart.find(c=>c.sku===sku);
    const delta = parseInt(b.dataset.qty);
    const next = item.qty + delta;
    if(next<=0){ cart = cart.filter(c=>c.sku!==sku); }
    else { item.qty = next; }
    renderCart();
  });
  $all('[data-qtyinput]', box).forEach(inp => {
    inp.oninput = () => {
      const sku = inp.closest('.cart-item').dataset.sku;
      const item = cart.find(c=>c.sku===sku);
      let v = Math.round(parseFloat(inp.value))||0;
      if(v<=0) return; // esperar a que termine de escribir antes de quitar la fila
      item.qty = v;
      // Actualiza subtotal, totales y pagos sin perder el foco del input mientras se escribe.
      const row = inp.closest('.cart-item');
      row.querySelector('.cart-subtotal').textContent = fmt(roundMoney(item.price*item.qty));
      const total = cart.reduce((a,c)=>a+roundMoney(c.price*c.qty),0);
      const totalUnits = cart.reduce((a,c)=>a+(c.unit==='kg'?0:c.qty),0);
      const totalWeightItems = cart.filter(c=>c.unit==='kg');
      const pill = $('#cartPill');
      if(pill){
        const parts = [];
        if(totalUnits>0) parts.push(`${totalUnits} ${totalUnits===1?'unidad':'unidades'}`);
        if(totalWeightItems.length) parts.push(totalWeightItems.map(c=>formatWeightKg(c.qty)).join(' + '));
        pill.textContent = `${cart.length} producto${cart.length===1?'':'s'} · ${parts.join(' · ') || '0 unidades'}`;
      }
      totals.innerHTML = `
        <div class="cart-total-row"><span class="muted">Unidades totales</span><span class="strong">${totalUnits}${totalWeightItems.length?' + '+totalWeightItems.map(c=>formatWeightKg(c.qty)).join(' + '):''}</span></div>
        <div class="cart-total-row"><span class="muted">Subtotal</span><span class="strong">${fmt(total)}</span></div>
        <div class="cart-total-row grand"><span>Total</span><span>${fmt(total)}</span></div>
      `;
      renderPaymentRows();
    };
    inp.onchange = () => {
      const sku = inp.closest('.cart-item').dataset.sku;
      const item = cart.find(c=>c.sku===sku);
      let v = Math.round(parseFloat(inp.value))||0;
      if(v<=0){ cart = cart.filter(c=>c.sku!==sku); }
      else { item.qty = v; }
      renderCart();
    };
  });
  // Input de peso (gramos o kilos) para productos vendidos por peso.
  $all('[data-weightinput]', box).forEach(inp => {
    const commit = (removeIfInvalid) => {
      const sku = inp.closest('.cart-item').dataset.sku;
      const item = cart.find(c=>c.sku===sku);
      const kg = parseWeightToKg(inp.value);
      if(kg==null || kg<=0){
        if(removeIfInvalid){ cart = cart.filter(c=>c.sku!==sku); renderCart(); }
        return;
      }
      item.qty = kg;
      renderCart();
    };
    inp.onchange = () => commit(true);
    inp.onkeydown = e => { if(e.key==='Enter') { commit(true); } };
  });
  $all('[data-remove]', box).forEach(b => b.onclick = () => {
    const sku = b.closest('.cart-item').dataset.sku;
    cart = cart.filter(c=>c.sku!==sku);
    renderCart();
  });
}

async function confirmSale(){
  if(!cart.length){ toast('Agregá al menos un producto', true); return; }
  // No bloqueamos la venta por falta de stock: el stock puede quedar en 0 o negativo
  // y se sincroniza automáticamente cuando se cargue el stock real más adelante.
  for(const c of cart){
    const p = PRODUCTS.find(x=>x.sku===c.sku);
    if(!p){ toast('El producto "'+c.name+'" ya no existe en el catálogo', true); return; }
  }
  const items = cart.map(c => ({sku:c.sku, name:c.name, qty:c.qty, unit:c.unit||'unidad', price:c.price, cost:c.cost, total:roundMoney(c.price*c.qty)}));
  const total = items.reduce((a,i)=>a+i.total,0);
  const payments = paymentDraft.map(p=>({method:p.method,amount:Math.round((Number(p.amount)||0)*100)/100})).filter(p=>p.amount>0);
  const paid = payments.reduce((a,p)=>a+p.amount,0);
  const difference = Math.round((total-paid)*100)/100;
  if(Math.abs(difference)>0.009){ toast((difference>0?'Faltan ':'El pago excede ') + fmt(Math.abs(difference)) + ' para completar la venta.', true); return; }
  const totalCost = items.reduce((a,i)=>a+i.cost*i.qty,0);
  const selectedClient = CLIENTS.find(c=>c.id===saleDraft.clientId);
  const ticketNumber = (Number(APP_SETTINGS.ticketSeq)||0) + 1;
  const seller = (CLOUD && typeof CLOUD.getCurrentUserEmail==='function') ? (CLOUD.getCurrentUserEmail()||'') : '';
  const sale = {id:'V-'+Date.now(), ticketNumber, seller, date:new Date().toISOString(), clientId:selectedClient?selectedClient.id:'', clientName:selectedClient?selectedClient.name:'', reference:saleDraft.reference.trim(), note:saleDraft.note.trim(), payments, items, total, totalCost, profit: total-totalCost};
  // 3. Snapshot para rollback si falla el almacenamiento local; la nube offline usa la cola y no bloquea la venta.
  const productStocks = cart.map(c=>({sku:c.sku,stock:PRODUCTS.find(p=>p.sku===c.sku).stock}));
  cart.forEach(c => { const p = PRODUCTS.find(x=>x.sku===c.sku); if(p) p.stock -= c.qty; });
  SALES.push(sale);
  try{
    await persistProducts();
    await persistSales();
  }catch(err){
    productStocks.forEach(x=>{ const p=PRODUCTS.find(p=>p.sku===x.sku); if(p) p.stock=x.stock; });
    SALES=SALES.filter(s=>s.id!==sale.id);
    // Si la primera escritura local alcanzó a completarse, se recompone también el snapshot local.
    await storageSet('inhala_products', PRODUCTS);
    await storageSet('inhala_sales', SALES);
    toast('La venta no se guardó localmente. Se revirtió el stock para evitar inconsistencias.', true);
    renderVenta();
    return;
  }
  // El número de ticket ya se usó y la venta quedó guardada; se persiste el contador aparte,
  // sin bloquear la venta si esta última escritura fallara.
  APP_SETTINGS = {...APP_SETTINGS, ticketSeq:ticketNumber};
  try{ await persistSettings(); }catch(e){ /* la venta ya está guardada; el contador se resincroniza en el próximo guardado */ }
  cart = [];
  saleDraft = {clientId:'', reference:'', note:''}; paymentDraft = [{method:'efectivo',amount:0}];
  renderVenta();
  toast('Venta ' + sale.id.replace('V-','') + ' registrada por ' + fmt(sale.total));
  openTicketModal(sale);
}

/* ================= HISTORIAL / REPORTES ================= */
function periodKey(dateIso, period){
  const d = new Date(dateIso);
  if(period==='day') return d.toISOString().slice(0,10);
  if(period==='month') return d.toISOString().slice(0,7);
  // week: ISO week start (Monday)
  const day = (d.getDay()+6)%7;
  const monday = new Date(d); monday.setDate(d.getDate()-day);
  return monday.toISOString().slice(0,10) + ' (sem.)';
}

function filteredSales(){
  let list = SALES;
  if(hf.from) list = list.filter(s => s.date.slice(0,10) >= hf.from);
  if(hf.to) list = list.filter(s => s.date.slice(0,10) <= hf.to);
  if(hf.product.trim()){
    const q = hf.product.trim().toLowerCase();
    list = list.filter(s => s.items.some(i => i.name.toLowerCase().includes(q) || i.sku.toLowerCase().includes(q)));
  }
  if(hf.method!=='all') list=list.filter(s=>(s.payments&&s.payments.length?s.payments:[{method:'efectivo',amount:s.total}]).some(p=>p.method===hf.method));
  return list.slice().sort((a,b)=> b.date.localeCompare(a.date));
}

function renderHistorial(){
  const el = $('#view-historial');
  const list = filteredSales();
  const total = list.reduce((a,s)=>a+s.total,0);
  const cost = list.reduce((a,s)=>a+s.totalCost,0);
  const profit = total-cost;
  const units = list.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.qty,0),0);

  const groups = {};
  list.forEach(s => {
    const k = periodKey(s.date, hf.period);
    if(!groups[k]) groups[k] = {total:0, cost:0, units:0, count:0};
    groups[k].total += s.total; groups[k].cost += s.totalCost;
    groups[k].units += s.items.reduce((x,i)=>x+i.qty,0); groups[k].count++;
  });
  const groupKeys = Object.keys(groups).sort().reverse();

  el.innerHTML = `
    <div class="toolbar">
      <div><label class="field-label">Desde</label><input type="date" id="hFrom" value="${hf.from}"></div>
      <div><label class="field-label">Hasta</label><input type="date" id="hTo" value="${hf.to}"></div>
      <div style="flex:1; min-width:200px;"><label class="field-label">Producto</label><div class="search">${ICONS.search}<input id="hProduct" placeholder="Nombre o SKU…" value="${esc(hf.product)}"></div></div>
      <div><label class="field-label">Pago</label><select id="hMethod"><option value="all">Todos</option><option value="efectivo" ${hf.method==='efectivo'?'selected':''}>Efectivo</option><option value="tarjeta" ${hf.method==='tarjeta'?'selected':''}>Tarjeta</option><option value="transferencia" ${hf.method==='transferencia'?'selected':''}>Transferencia</option></select></div>
      <div>
        <label class="field-label">Agrupar por</label>
        <div class="chip-row">
          <button class="chip ${hf.period==='day'?'active':''}" data-period="day">Día</button>
          <button class="chip ${hf.period==='week'?'active':''}" data-period="week">Semana</button>
          <button class="chip ${hf.period==='month'?'active':''}" data-period="month">Mes</button>
        </div>
      </div>
    </div>

    <div class="grid kpis" style="grid-template-columns:repeat(4,1fr); margin-bottom:18px;">
      <div class="card kpi"><div class="kpi-bar"></div><div class="label">${ICONS.cart} Ventas</div><div class="value">${fmtInt(list.length)}</div><div class="delta">${fmtInt(units)} unidades vendidas</div></div>
      <div class="card kpi"><div class="kpi-bar"></div><div class="label">${ICONS.money} Facturado</div><div class="value" style="font-size:21px;">${fmt(total)}</div><div class="delta">en el período filtrado</div></div>
      <div class="card kpi"><div class="kpi-bar"></div><div class="label">${ICONS.money} Costo de mercadería</div><div class="value" style="font-size:21px;">${fmt(cost)}</div><div class="delta">costo de lo vendido</div></div>
      <div class="card kpi"><div class="kpi-bar"></div><div class="label">${ICONS.trend} Ganancia</div><div class="value" style="font-size:21px; color:var(--green-700);">${fmt(profit)}</div><div class="delta">facturado − costo</div></div>
    </div>

    <div class="card" style="padding:18px 20px; margin-bottom:16px;">
      <h2 class="section-title">Totales por ${hf.period==='day'?'día':hf.period==='week'?'semana':'mes'}</h2>
      ${groupKeys.length ? `<table>
        <thead><tr><th>Período</th><th style="text-align:right;">Ventas</th><th style="text-align:right;">Unidades</th><th style="text-align:right;">Facturado</th><th style="text-align:right;">Ganancia</th></tr></thead>
        <tbody>${groupKeys.map(k => { const g = groups[k]; return `<tr>
          <td>${esc(k)}</td><td class="num" style="text-align:right;">${g.count}</td>
          <td class="num" style="text-align:right;">${g.units}</td>
          <td class="num" style="text-align:right;">${fmt(g.total)}</td>
          <td class="num" style="text-align:right; color:var(--green-700); font-weight:700;">${fmt(g.total-g.cost)}</td>
        </tr>`; }).join('')}</tbody>
      </table>` : `<div class="empty">${ICONS.empty}<div class="t">No hay ventas en este rango</div></div>`}
    </div>

    <div class="card" style="padding:18px 20px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;"><h2 class="section-title">Detalle de ventas</h2><span class="hint">Cada fila es una venta completa</span></div>
      ${list.length ? `<table>
        <thead><tr><th>Venta</th><th>Fecha</th><th>Productos</th><th>Pago</th><th style="text-align:right;">Unidades</th><th style="text-align:right;">Total</th><th style="text-align:right;">Ganancia</th><th style="text-align:right;">Acciones</th></tr></thead>
        <tbody>${list.slice(0,300).map(s => `<tr>
          <td><div class="strong">#${esc(String(s.id||'').replace('V-',''))}</div>${s.clientName?`<div class="muted" style="font-size:11px;">${esc(s.clientName)}</div>`:(s.reference?`<div class="muted" style="font-size:11px;">${esc(s.reference)}</div>`:'')}</td>
          <td class="num">${fmtDateTime(s.date)}</td>
          <td><div class="strong" style="font-size:12px;">${s.items.map(i=>esc(i.name)+' ×'+(i.unit==='kg'?formatWeightKg(i.qty):i.qty)).join(', ')}</div>${s.note?`<div class="muted" style="font-size:11px; margin-top:3px;">${esc(s.note)}</div>`:''}</td>
          <td>${(s.payments&&s.payments.length?s.payments:[{method:'efectivo',amount:s.total}]).map(p=>`<span class="badge ok" style="margin:1px 3px 1px 0;">${paymentMethodLabel(p.method)} ${fmt(p.amount)}</span>`).join('')}</td>
          <td class="num" style="text-align:right;">${s.items.reduce((a,i)=>a+i.qty,0)}</td>
          <td class="num" style="text-align:right;">${fmt(s.total)}</td>
          <td class="num" style="text-align:right; color:var(--green-700); font-weight:700;">${fmt(s.profit)}</td>
          <td style="text-align:right; white-space:nowrap;"><div class="sale-history-actions"><button class="btn secondary sm" data-sale-ticket="${esc(s.id)}" title="Imprimir ticket">${ICONS.print} Imprimir ticket</button><button class="btn secondary sm" data-sale-edit="${esc(s.id)}">${ICONS.edit} Ver / editar</button><button class="icon-btn" data-sale-del="${esc(s.id)}" title="Eliminar venta">${ICONS.trash}</button></div></td>
        </tr>`).join('')}</tbody>
      </table>${list.length>300?`<div class="hint" style="margin-top:8px;">Mostrando las 300 ventas más recientes del rango filtrado.</div>`:''}` : `<div class="empty">${ICONS.empty}<div class="t">No hay ventas para mostrar</div></div>`}
    </div>
  `;

  $('#hFrom').onchange = e => { hf.from = e.target.value; renderHistorial(); };
  $('#hTo').onchange = e => { hf.to = e.target.value; renderHistorial(); };
  $('#hProduct').oninput = e => { hf.product = e.target.value; withFocusPreserved(renderHistorial); };
  $('#hMethod').onchange = e => { hf.method=e.target.value; renderHistorial(); };
  $all('[data-period]').forEach(b => b.onclick = () => { hf.period = b.dataset.period; renderHistorial(); });
  $all('[data-sale-edit]').forEach(b => b.onclick = () => openSaleEditor(b.dataset.saleEdit));
  $all('[data-sale-del]').forEach(b => b.onclick = () => confirmDeleteSale(b.dataset.saleDel));
  $all('[data-sale-ticket]').forEach(b => b.onclick = () => openTicketModalById(b.dataset.saleTicket));
}

function recomputeSale(sale){
  sale.items = sale.items.filter(i=>i.qty>0).map(i=>{
    const isWeight = i.unit==='kg';
    const qty = isWeight ? Math.max(0.001, Math.round((i.qty||0)*1000)/1000) : Math.max(1, Math.round(i.qty||0));
    const price = Math.max(0, Number(i.price)||0);
    return { ...i, qty, price, cost:Math.max(0,Number(i.cost)||0), total:roundMoney(price*qty) };
  });
  sale.total = sale.items.reduce((a,i)=>a+i.total,0);
  sale.totalCost = sale.items.reduce((a,i)=>a+i.cost*i.qty,0);
  sale.profit = sale.total-sale.totalCost;
}
function confirmDeleteSale(id){
  const sale = SALES.find(s=>s.id===id); if(!sale) return;
  showModal(`
    <div class="modal-head"><h3>Eliminar venta #${esc(String(id).replace('V-',''))}</h3><button class="icon-btn" data-close>${ICONS.close}</button></div>
    <div class="modal-body"><p style="margin:0; line-height:1.5;">Se eliminará la venta y se devolverá el stock de sus ${sale.items.reduce((a,i)=>a+i.qty,0)} unidades al inventario.</p></div>
    <div class="modal-foot"><button class="btn secondary" data-close>Cancelar</button><button class="btn danger" id="confirmDeleteSale">${ICONS.trash} Eliminar venta</button></div>
  `);
  $('#confirmDeleteSale').onclick = async () => {
    sale.items.forEach(i=>{ const p=PRODUCTS.find(x=>x.sku===i.sku); if(p) p.stock+=i.qty; });
    SALES = SALES.filter(s=>s.id!==id);
    await persistProducts(); await persistSales(); closeModal(); renderHistorial(); toast('Venta eliminada y stock devuelto');
  };
}
function openSaleEditor(id){
  const original = SALES.find(s=>s.id===id); if(!original) return;
  const sale = JSON.parse(JSON.stringify(original));
  const draw = () => {
    showModal(`
      <div class="modal-head"><h3>Editar venta #${esc(String(id).replace('V-',''))}</h3><button class="icon-btn" data-close>${ICONS.close}</button></div>
      <div class="modal-body">
        <div class="field-row"><div><label class="field-label">Fecha y hora</label><input id="editSaleDate" type="datetime-local" style="width:100%;" value="${new Date(sale.date).toISOString().slice(0,16)}"></div><div><label class="field-label">Referencia o comprador</label><input id="editSaleReference" style="width:100%;" value="${esc(sale.reference||'')}"></div></div>
        <div><label class="field-label">Nota interna</label><input id="editSaleNote" style="width:100%;" value="${esc(sale.note||'')}"></div>
        <div style="overflow:auto; margin-top:12px;"><table><thead><tr><th>Producto</th><th style="text-align:right;">Cantidad</th><th style="text-align:right;">Precio unit.</th><th></th></tr></thead><tbody>
          ${sale.items.map((i,n)=>`<tr><td><div class="strong">${esc(i.name)}</div><div class="muted">SKU ${esc(i.sku)}${i.unit==='kg'?' · por kg':''}</div></td><td style="text-align:right;"><input data-edit-qty="${n}" type="number" min="0" step="${i.unit==='kg'?'0.001':'1'}" value="${i.qty}" style="width:76px; text-align:right;"></td><td style="text-align:right;"><input data-edit-price="${n}" type="number" min="0" step="0.01" value="${i.price}" style="width:112px; text-align:right;"></td><td style="text-align:right;"><button class="icon-btn" data-edit-remove="${n}" title="Quitar producto">${ICONS.close}</button></td></tr>`).join('')}
        </tbody></table></div>
        <div class="hint" style="margin-top:10px;">La modificación ajusta automáticamente el stock según la diferencia de cantidades. Los productos por peso aceptan decimales (kg).</div>
      </div>
      <div class="modal-foot"><button class="btn secondary" id="printSaleEdit" style="margin-right:auto;">${ICONS.print} Reimprimir ticket</button><button class="btn secondary" data-close>Cancelar</button><button class="btn" id="saveSaleEdit">${ICONS.check} Guardar venta</button></div>
    `);
    $all('[data-edit-remove]').forEach(b=>b.onclick=()=>{ sale.items.splice(+b.dataset.editRemove,1); draw(); });
    $('#printSaleEdit').onclick = () => openTicketModal(original);
    $('#saveSaleEdit').onclick = async () => {
      sale.items.forEach((i,n)=>{
        const raw = parseFloat($(`[data-edit-qty="${n}"]`).value)||0;
        i.qty = i.unit==='kg' ? Math.max(0, Math.round(raw*1000)/1000) : Math.max(0, Math.round(raw));
        i.price=Math.max(0,parseFloat($(`[data-edit-price="${n}"]`).value)||0);
      });
      if(!sale.items.some(i=>i.qty>0)){ toast('La venta debe tener al menos un producto', true); return; }
      // No bloqueamos por falta de stock: el stock puede quedar en 0 o negativo y se sincroniza después.
      for(const i of sale.items){ const p=PRODUCTS.find(x=>x.sku===i.sku); if(!p){ toast('El producto "'+i.name+'" ya no existe en el catálogo', true); return; } }
      original.items.forEach(i=>{ const p=PRODUCTS.find(x=>x.sku===i.sku); if(p) p.stock+=i.qty; });
      sale.items.forEach(i=>{ const p=PRODUCTS.find(x=>x.sku===i.sku); p.stock-=i.qty; });
      sale.date = new Date($('#editSaleDate').value).toISOString(); sale.reference=$('#editSaleReference').value.trim(); sale.note=$('#editSaleNote').value.trim(); recomputeSale(sale);
      Object.assign(original,sale); await persistProducts(); await persistSales(); closeModal(); renderHistorial(); toast('Venta actualizada');
    };
  };
  draw();
}

/* ================= ACCESOS E INICIO ================= */
let personalStarted=false;
function accessMode(){ return new URLSearchParams(window.location.search).get('access'); }
function setAccess(mode){ const url=new URL(window.location.href); url.searchParams.set('access',mode); window.location.href=url.toString(); }
function applyAccessBackground(){
  const gate=$('#accessGate'); if(!gate) return;
  const url=safeImageUrl(PUBLIC_STOREFRONT.coverUrl,'');
  gate.style.backgroundImage=url ? cssImageUrl(url) : 'linear-gradient(135deg,var(--green-950),var(--green-700))';
}
function renderAccessGate(login){
  const gate=$('#accessGate'); gate.style.display='flex';
  applyAccessBackground();
  gate.innerHTML=login?`<div class="access-login"><h2>Acceso de personal</h2><label class="field-label" for="staffEmail" style="margin-top:16px;">Email</label><input id="staffEmail" type="email" autocomplete="email" style="width:100%;" required><label class="field-label" for="staffPassword" style="margin-top:12px;">Contraseña</label><input id="staffPassword" type="password" autocomplete="current-password" style="width:100%;" required><div class="hint" id="staffLoginError" style="color:var(--red);"></div><button class="btn" id="staffLogin">Ingresar</button><button class="btn secondary" id="backAccess" style="width:100%;justify-content:center;margin-top:10px;">Volver</button></div>`:`<div class="access-gate-box"><button class="access-admin-trigger" id="staffAccess" aria-label="Acceso de personal"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 3.5C12.6 3.9 6.9 7.3 4.4 13.2c-1 2.4-1.1 4.8-1.1 6.1 1.6-.1 4.1-.4 6.5-1.6 5.7-2.8 9-8.2 10.7-14.2ZM6.2 17.8c2.7-4.1 6.1-7.4 10.6-10.1-3.6 3-6.2 6.6-8.7 10.7l-1.9-.6Z"/></svg></button><h1>Inhala&Co</h1><div class="access-options"><button class="access-option" id="customerAccess">${ICONS.store}<strong>Cliente</strong></button></div></div>`;
  if(login){
    $('#staffLogin').onclick=async()=>{ const email=$('#staffEmail').value.trim(), password=$('#staffPassword').value; if(!email||!password){$('#staffLoginError').textContent='Completá email y contraseña.';return;} try{const cloud=await waitForCloud();await cloud.signInPersonal(email,password);}catch(error){$('#staffLoginError').textContent='No se pudo iniciar sesión. Verificá los datos y que Email/Password esté habilitado en Firebase.';} };
    $('#backAccess').onclick=()=>{ const url=new URL(window.location.href);url.searchParams.delete('access');window.location.href=url.toString(); };
  }else{ $('#customerAccess').onclick=()=>setAccess('cliente'); $('#staffAccess').onclick=()=>setAccess('personal'); }
}
async function initClient(){
  $('#clientPortal').style.display='block';
  renderClientPortal();
  onlineCart=await storageGet('inhala_online_cart') || [];
  renderClientPortal();
  CLOUD=await waitForCloud();
  startCatalogSync();
}
async function initPersonal(){
  if(personalStarted) return; personalStarted=true;
  $('#accessGate').style.display='none';
  document.getElementById('app').style.display='flex';
  renderNav();
  setView('dashboard');
  APP_SETTINGS = normalizeAppSettings(await storageGet('inhala_settings'));
  onlineCart = await storageGet('inhala_online_cart') || [];
  await loadSyncQueue();
  applyAppearance();
  await loadData();
  await removeExactInventoryDuplicates();
  renderNav();
  renderDashboard();
  setView('dashboard');
  startCloudSync();
  startCatalogSync();
  CLOUD.saveStorefront(APP_SETTINGS).catch(error=>console.warn('No se pudo publicar la información de tienda',error));
  await startSheetSync();
  updateSyncIndicator();
  processSyncQueue();
}
window.addEventListener('inhala-auth-required', () => { if(accessMode()==='personal') renderAccessGate(true); });
window.addEventListener('inhala-authenticated', () => { if(accessMode()==='personal') initPersonal(); });
window.addEventListener('online', ()=>{ syncState.online=true; updateSyncIndicator(); pullInventoryFromSheet(false); processSyncQueue(); });
window.addEventListener('offline', ()=>{ syncState.online=false; updateSyncIndicator(); });
function loadPublicAccessAppearance(){ waitForCloud().then(cloud=>{ if(cloud.subscribeStorefront) cloud.subscribeStorefront(data=>{ PUBLIC_STOREFRONT={businessName:String(data.businessName||'Inhala&Co'),businessPhone:String(data.businessPhone||''),mpAlias:String(data.mpAlias||''),coverUrl:String(data.coverUrl||'')}; applyAccessBackground(); }); }); }
if(accessMode()==='cliente') initClient();
else if(accessMode()==='personal') { renderAccessGate(true); loadPublicAccessAppearance(); }
else { renderAccessGate(false); loadPublicAccessAppearance(); }

})();

</script>
