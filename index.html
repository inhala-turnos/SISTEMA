<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inhala&Co</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --green-950:#0b1f16;
    --green-900:#0f2b1e;
    --green-800:#123825;
    --green-700:#146c43;
    --green-600:#1a8a56;
    --green-500:#2fa36b;
    --green-400:#4bc48a;
    --green-100:#e3f3ea;
    --green-50:#f4faf6;
    --amber:#b45309;
    --amber-bg:#fef3e0;
    --red:#c0362c;
    --red-bg:#fbe9e7;
    --ink:#12241c;
    --ink-soft:#54655c;
    --ink-faint:#8a988f;
    --line:#e1e9e3;
    --bg:#f6faf7;
    --surface:#ffffff;
    --shadow: 0 1px 2px rgba(15,43,30,.06), 0 6px 20px -8px rgba(15,43,30,.12);
    --radius: 12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Roboto','Google Sans','Segoe UI',Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:76px; flex:0 0 76px;
    background:linear-gradient(180deg,var(--green-900),var(--green-950));
    color:#eaf6ee;
    display:flex; flex-direction:column;
    padding:18px 8px;
    position:sticky; top:0; height:100vh;
    transition:background .2s ease;
  }
  .brand{display:flex; align-items:center; justify-content:center; padding:0 0 22px;}
  .brand-logo{width:46px; height:46px; object-fit:cover; border-radius:13px; background:#fff; border:1px solid rgba(255,255,255,.16); box-shadow:0 5px 14px rgba(0,0,0,.22);}
  .nav{display:flex; flex-direction:column; gap:5px; margin-top:6px;}
  .nav-item{
    display:flex; align-items:center; justify-content:center;
    height:46px; padding:10px; border-radius:11px;
    color:#c9dccf; font-size:14px; font-weight:500;
    cursor:pointer; border:none; background:transparent; text-align:left; width:100%;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item svg{flex:0 0 auto; opacity:.9;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{background:var(--green-600); color:#fff; box-shadow:0 4px 14px -4px rgba(47,163,107,.55);}
  .nav-sep{height:1px; background:rgba(255,255,255,.08); margin:14px 4px;}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 30px; border-bottom:1px solid var(--line); background:var(--surface);
    position:sticky; top:0; z-index:20;
  }
  .topbar h1{font-size:19px; margin:0; font-weight:700; letter-spacing:-.2px;}
  .topbar .sub{color:var(--ink-soft); font-size:13px; margin-top:2px;}
  .content{padding:26px 30px 60px; flex:1;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---------- Generic ---------- */
  .grid{display:grid; gap:16px;}
  .kpis{grid-template-columns:repeat(4,1fr); margin-bottom:20px;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .kpi{padding:18px 20px; position:relative; overflow:hidden;}
  .kpi .label{font-size:12.5px; color:var(--ink-soft); font-weight:500; display:flex; align-items:center; gap:6px;}
  .kpi .value{font-size:26px; font-weight:900; margin-top:8px; letter-spacing:-.5px;}
  .kpi .delta{font-size:12px; margin-top:6px; color:var(--ink-faint);}
  .kpi.warn{border-color:#f3d9ad;}
  .kpi.danger{border-color:#f0c4bd;}
  .kpi-bar{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--green-500);}
  .kpi.warn .kpi-bar{background:#d68a1d;}
  .kpi.danger .kpi-bar{background:var(--red);}

  h2.section-title{font-size:15px; font-weight:700; margin:0 0 12px 2px; letter-spacing:-.1px;}
  .two-col{grid-template-columns:1.3fr 1fr;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px;
    color:var(--ink-soft); font-weight:700; padding:9px 12px; border-bottom:1px solid var(--line);
    background:var(--green-50); white-space:nowrap;
  }
  td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--green-50);}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:100px;}
  .badge.ok{background:var(--green-100); color:var(--green-700);}
  .badge.low{background:var(--amber-bg); color:var(--amber);}
  .badge.out{background:var(--red-bg); color:var(--red);}
  .badge.dot::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}

  .btn{
    display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600;
    padding:9px 15px; border-radius:9px; border:1px solid transparent; cursor:pointer;
    background:var(--green-600); color:#fff; transition:filter .12s ease, transform .04s ease;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:var(--surface); color:var(--ink); border-color:var(--line);}
  .btn.secondary:hover{background:var(--green-50); border-color:var(--green-500);}
  .btn.ghost{background:transparent; color:var(--green-700); padding:7px 10px;}
  .btn.ghost:hover{background:var(--green-100);}
  .btn.danger{background:var(--red); color:#fff;}
  .btn.sm{padding:6px 10px; font-size:12px; border-radius:7px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .icon-btn{
    width:30px; height:30px; border-radius:7px; border:1px solid var(--line); background:var(--surface);
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
  }
  .icon-btn:hover{background:var(--green-50); color:var(--green-700); border-color:var(--green-500);}

  input, select{
    font-family:inherit; font-size:13px; padding:8px 11px; border-radius:8px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink); outline:none;
  }
  input:focus, select:focus{border-color:var(--green-500); box-shadow:0 0 0 3px var(--green-100);}
  input.cell-edit{padding:5px 7px; width:100%; font-size:13px;}
  label.field-label{font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:5px;}

  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  .toolbar .search{flex:1; min-width:220px; position:relative;}
  .toolbar .search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint);}
  .toolbar .search input{width:100%; padding-left:34px;}
  .pill-count{font-size:11px; background:var(--green-100); color:var(--green-700); padding:2px 8px; border-radius:100px; font-weight:700;}

  .empty{padding:50px 20px; text-align:center; color:var(--ink-soft);}
  .empty svg{color:var(--green-400); margin-bottom:10px;}
  .empty .t{font-weight:700; color:var(--ink); font-size:14px; margin-bottom:4px;}

  .pagination{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; font-size:12.5px; color:var(--ink-soft);}
  .pagination .btns{display:flex; gap:6px;}

  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(11,31,22,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .overlay.active{display:flex;}
  .modal{background:var(--surface); border-radius:14px; width:100%; max-width:460px; box-shadow:0 20px 60px -12px rgba(0,0,0,.35); max-height:90vh; overflow:auto;}
  .modal-head{padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
  .modal-head h3{margin:0; font-size:16px;}
  .modal-body{padding:20px 22px; display:flex; flex-direction:column; gap:14px;}
  .modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .hint{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}

  /* POS */
  .pos-hero{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 20px; margin-bottom:18px; background:linear-gradient(120deg,#fff,var(--green-50));}
  .pos-hero-title{display:flex; align-items:center; gap:13px;}
  .pos-hero-icon{width:48px; height:48px; border-radius:12px; background:var(--green-100); color:var(--green-700); display:flex; align-items:center; justify-content:center;}
  .pos-hero-icon svg{width:25px; height:25px;}
  .pos-hero h2{margin:0; font-size:21px; letter-spacing:-.3px;}
  .pos-hero p{margin:3px 0 0; color:var(--ink-soft); font-size:13px;}
  .pos-grid{grid-template-columns:1.28fr .92fr; align-items:start; gap:18px;}
  .pos-panel{padding:18px 20px; border-radius:14px;}
  .pos-panel-title{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;}
  .pos-panel-title h2{display:flex; align-items:center; gap:9px; margin:0; font-size:16px;}
  .pos-panel-title h2 svg{color:var(--green-600);}
  .pos-search-row{display:flex; gap:10px; margin-bottom:12px;}
  .pos-search-row .search{flex:1; position:relative;}
  .pos-search-row .search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint);}
  .pos-search-row .search input{width:100%; padding-left:34px;}
  .pos-filter{min-width:134px;}
  .pos-results{max-height:560px; overflow:auto; border:1px solid var(--line); border-radius:10px;}
  .pos-row{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s ease, transform .12s ease;}
  .pos-row:last-child{border-bottom:none;}
  .pos-row:hover{background:var(--green-50);}
  .pos-row .name{font-weight:600; font-size:13px;}
  .pos-row .meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .pos-row .price{font-weight:800; font-size:13px; color:var(--green-700);}
  .pos-row .add-arrow{font-size:24px; line-height:1; margin-left:12px; color:var(--ink-faint);}
  .sale-data-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .sale-data-grid .span-2{grid-column:1/-1;}
  .sale-receipt{border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--surface);}
  .sale-receipt-head{padding:14px; background:linear-gradient(135deg,var(--green-50),#fff); border-bottom:1px solid var(--green-100);}
  .sale-receipt-lines{padding:5px 14px 0; max-height:340px; overflow:auto;}
  .cart-columns{display:grid; grid-template-columns:minmax(0,1fr) 108px 96px 104px 28px; gap:8px; align-items:center; padding:11px 0 8px; font-size:10.5px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.2px;}
  .sale-receipt-summary{margin:0 14px 14px; padding:10px 12px; border-radius:9px; background:var(--green-50); border:1px solid var(--green-100);}
  .cart-item{display:grid; grid-template-columns:minmax(0,1fr) 108px 96px 104px 28px; gap:8px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
  .cart-item:last-child{border-bottom:none;}
  .cart-product{display:flex; align-items:center; gap:9px; min-width:0;}
  .cart-item .name{min-width:0; font-size:12.5px; font-weight:700;}
  .cart-unit{font-size:12px; color:var(--ink-soft);}
  .cart-subtotal{text-align:right; font-size:14px;}
  .qty-ctrl{display:flex; align-items:center; gap:4px;}
  .qty-ctrl button{width:24px; height:24px; border-radius:6px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-weight:700;}
  .qty-ctrl input{width:38px; text-align:center; padding:4px;}
  .cart-total-row{display:flex; justify-content:space-between; padding:8px 0; font-size:13.5px;}
  .cart-total-row.grand{font-size:20px; font-weight:900; border-top:1px solid var(--green-100); margin-top:6px; padding-top:12px; color:var(--green-900);}
  .sale-action{width:100%; justify-content:center; margin-top:14px; padding:13px; font-size:14px;}
  .sale-history-actions{display:flex; justify-content:flex-end; gap:6px;}
  .sale-security{display:flex; align-items:center; justify-content:center; gap:7px; color:var(--ink-soft); font-size:11.5px; margin-top:13px;}

  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{font-size:12px; padding:6px 12px; border-radius:100px; border:1px solid var(--line); background:var(--surface); cursor:pointer; color:var(--ink-soft); font-weight:600; display:inline-flex; align-items:center; gap:6px;}
  .chip.active{background:var(--green-600); border-color:var(--green-600); color:#fff;}

  .bars{display:flex; align-items:flex-end; gap:6px; height:140px; padding:10px 4px 0;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .bar{width:100%; border-radius:5px 5px 2px 2px; background:linear-gradient(180deg,var(--green-400),var(--green-600)); min-height:2px;}
  .bar-col .lbl{font-size:9.5px; color:var(--ink-faint); white-space:nowrap;}

  .toast-wrap{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--green-900); color:#fff; padding:12px 18px; border-radius:10px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow); display:flex; align-items:center; gap:9px; animation:slideIn .18s ease;}
  .toast.err{background:var(--red);}
  @keyframes slideIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  .loading-screen{position:fixed; inset:0; background:#f8fbfa; display:flex; align-items:center; justify-content:flex-end; flex-direction:column; gap:10px; z-index:500; padding:clamp(24px,6vh,68px); overflow:hidden;}
  .loading-cover{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center center; z-index:0;}
  .loading-screen::after{content:''; position:absolute; inset:0; z-index:1; background:linear-gradient(180deg,transparent 70%,rgba(255,255,255,.5)); pointer-events:none;}
  .loading-screen > :not(.loading-cover){position:relative; z-index:2;}
  .spinner{width:30px; height:30px; border-radius:50%; border:3px solid rgba(20,108,67,.18); border-top-color:var(--green-600); animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .cat-chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:100px; border:1px solid; white-space:nowrap;}
  .cat-chip.sm{font-size:10.5px; padding:2px 8px; font-weight:600;}
  .cat-dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto; display:inline-block;}
  .chip .cat-dot{margin-right:1px;}
  .thumb-img{object-fit:cover; border-radius:8px; border:1px solid var(--line); background:var(--green-50); flex:0 0 auto; display:block;}
  .settings-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
  .settings-card{padding:20px;}
  .settings-preview{height:180px; margin-top:14px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--green-50); position:relative;}
  .settings-preview.cover{background:center/cover no-repeat;}
  .settings-preview.logo{display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#eff7f1,#dcefe2);}
  .settings-preview.logo img{width:116px; height:116px; object-fit:cover; border-radius:24px; background:#fff; box-shadow:0 10px 24px rgba(15,43,30,.16);}
  .settings-preview-label{position:absolute; left:10px; bottom:10px; color:#fff; background:rgba(11,31,22,.72); font-size:11px; font-weight:700; padding:5px 8px; border-radius:6px;}
  .sortable{cursor:pointer; user-select:none;}
  .sortable .arrow{opacity:.4; margin-left:3px;}
  .muted{color:var(--ink-faint);}
  .num{font-variant-numeric:tabular-nums;}
  .strong{font-weight:700;}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#cfe0d5; border-radius:20px;}
  @media(max-width:980px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    .two-col, .pos-grid{grid-template-columns:1fr;}
    .sidebar{width:76px; flex:0 0 76px; padding:18px 8px;}
  }
  @media(max-width:620px){
    .settings-grid{grid-template-columns:1fr;}
    .pos-hero{padding:14px; align-items:flex-start;}
    .pos-hero h2{font-size:18px;}
    .pos-hero .btn{padding:8px 10px; font-size:0;}
    .pos-hero .btn svg{margin:0;}
    .pos-panel{padding:14px;}
    .pos-search-row{flex-direction:column;}
    .pos-filter{width:100%;}
    .sale-data-grid{grid-template-columns:1fr;}
    .sale-data-grid .span-2{grid-column:auto;}
    .cart-columns{display:none;}
    .cart-item{grid-template-columns:minmax(0,1fr) 92px 28px; gap:8px;}
    .cart-unit{display:none;}
    .cart-subtotal{grid-column:2; grid-row:1; font-size:13px;}
    .qty-ctrl{grid-column:2; grid-row:2;}
    .cart-item > .icon-btn{grid-column:3; grid-row:1 / span 2;}
  }
</style>
</head>

  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: 'AIzaSyCsdF5kcVk_TeNb6qqgC00_bpwm-78UJbE',
    authDomain: 'sistemainhala.firebaseapp.com',
    projectId: 'sistemainhala',
    storageBucket: 'sistemainhala.firebasestorage.app',
    messagingSenderId: '445787560913',
    appId: '1:445787560913:web:eb2946856e0a9094e45ef0'
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const inventoryRef = doc(db, 'inhala_private', 'inventory');
  const salesRef = doc(db, 'inhala_private', 'sales');
  const clientsRef = doc(db, 'inhala_private', 'clients');
  const settingsRef = doc(db, 'inhala_private', 'settings');
  let currentUser = null, userResolver = null;
  const userReady = new Promise(resolve => { userResolver = resolve; });

  onAuthStateChanged(auth, user => {
    currentUser = user || null;
    if(currentUser){ userResolver(currentUser); window.dispatchEvent(new Event('inhala-authenticated')); }
    else window.dispatchEvent(new Event('inhala-auth-required'));
  });

  window.inhalaCloud = {
    async waitForUser(){ return currentUser || userReady; },
    async signIn(email, password){ return signInWithEmailAndPassword(auth, email, password); },
    async load(){
      const [inventory, sales, clients, settings] = await Promise.all([getDoc(inventoryRef), getDoc(salesRef), getDoc(clientsRef), getDoc(settingsRef)]);
      return { inventoryExists: inventory.exists(), inventory: inventory.exists() ? inventory.data() : null, sales: sales.exists() ? sales.data() : null, clients: clients.exists() ? clients.data() : null, settingsExists: settings.exists(), settings: settings.exists() ? settings.data() : null };
    },
    saveInventory(products, seq){ return setDoc(inventoryRef, { products, seq, updatedAt: Date.now() }); },
    saveSales(sales){ return setDoc(salesRef, { sales, updatedAt: Date.now() }); },
    saveClients(clients){ return setDoc(clientsRef, { clients, updatedAt: Date.now() }); },
    saveSettings(settings){ return setDoc(settingsRef, { settings, updatedAt: Date.now() }); },
    subscribe(onInventory, onSales, onClients, onSettings){
      const stopInventory = onSnapshot(inventoryRef, snap => { if(snap.exists()) onInventory(snap.data()); });
      const stopSales = onSnapshot(salesRef, snap => { if(snap.exists()) onSales(snap.data()); });
      const stopClients = onSnapshot(clientsRef, snap => { if(snap.exists()) onClients(snap.data()); });
      const stopSettings = onSnapshot(settingsRef, snap => { if(snap.exists() && onSettings) onSettings(snap.data()); });
      return () => { stopInventory(); stopSales(); stopClients(); stopSettings(); };
    }
  };
  window.dispatchEvent(new Event('inhala-cloud-ready'));
</script>

// Re-renders a view while keeping focus + cursor position on whatever input triggered it,

function withFocusPreserved(renderFn){
  const active = document.activeElement;
  let saved = null;
  if(active && active.id && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA')){
    saved = {id: active.id, start: active.selectionStart, end: active.selectionEnd};

    const el = document.getElementById(saved.id);
    if(el){

  }

function hashStr(s){

  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h;
}

    fg: `hsl(${hue},70%,26%)`,
    border: `hsl(${hue},55%,82%)`
  };
}
function categoryChip(cat, small){

/* ---------- Storage ---------- */
async function storageGet(key){
  try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function storageSet(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), false); return true; }
  catch(e){ console.error('storage error', e); return false; }
}

function waitForCloud(){
  if(window.inhalaCloud) return Promise.resolve(window.inhalaCloud);
  return new Promise(resolve => window.addEventListener('inhala-cloud-ready', () => resolve(window.inhalaCloud), {once:true}));
}

async function loadData(){
  CLOUD = await waitForCloud();
  await CLOUD.waitForUser();
  const remote = await CLOUD.load();
  if(remote.inventoryExists){
    PRODUCTS = Array.isArray(remote.inventory.products) ? remote.inventory.products : [];
    SALES = Array.isArray(remote.sales && remote.sales.sales) ? remote.sales.sales : [];
    CLIENTS = Array.isArray(remote.clients && remote.clients.clients) ? remote.clients.clients : [];
    manualSkuSeq = remote.inventory.seq || 1;
    APP_SETTINGS = normalizeAppSettings(remote.settings && remote.settings.settings);
    await storageSet('inhala_settings', APP_SETTINGS);
    applyAppearance();
    if(!remote.settingsExists) await CLOUD.saveSettings(APP_SETTINGS);
    return;
  }

  let prods = await storageGet('inhala_products');
  if(!prods){
    prods = (window.__INHALA_PRODUCTS__ || []).map(r => ({
      sku: r[0], name: r[1], price: r[2], provider: r[3] || 'Sin proveedor',
      category: r[4] || 'Otros', cost: 0, stock: 0, minStock: 5, image: ''
    }));
    await storageSet('inhala_products', prods);
  }
  let sales = await storageGet('inhala_sales');
  if(!sales){ sales = []; await storageSet('inhala_sales', sales); }
  let clients = await storageGet('inhala_clients');
  if(!clients){ clients = []; await storageSet('inhala_clients', clients); }
  let seq = await storageGet('inhala_seq');
  APP_SETTINGS = normalizeAppSettings(await storageGet('inhala_settings'));
  PRODUCTS = prods;
  SALES = sales;
  CLIENTS = clients;
  manualSkuSeq = seq || 1;
  applyAppearance();
  await Promise.all([CLOUD.saveInventory(PRODUCTS, manualSkuSeq), CLOUD.saveSales(SALES), CLOUD.saveClients(CLIENTS), CLOUD.saveSettings(APP_SETTINGS)]);
}
async function persistProducts(){
  await storageSet('inhala_products', PRODUCTS);
  if(CLOUD) await CLOUD.saveInventory(PRODUCTS, manualSkuSeq);
}
async function persistSales(){
  await storageSet('inhala_sales', SALES);
  if(CLOUD) await CLOUD.saveSales(SALES);
}
async function persistClients(){
  await storageSet('inhala_clients', CLIENTS);
  if(CLOUD) await CLOUD.saveClients(CLIENTS);
}
async function persistSeq(){
  await storageSet('inhala_seq', manualSkuSeq);
  if(CLOUD) await CLOUD.saveInventory(PRODUCTS, manualSkuSeq);
}
function inventoryDuplicateKey(product){
  const normalize = value => String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  return normalize(product.provider)+'|'+normalize(product.name);
}
async function removeExactInventoryDuplicates(){
  const primaryByKey = new Map();
  const cleaned = [];
  let removed = 0;
  for(const product of PRODUCTS){
    const key = inventoryDuplicateKey(product);
    const primary = primaryByKey.get(key);
    if(!primary){ primaryByKey.set(key, product); cleaned.push(product); continue; }
    primary.stock = (Number(primary.stock)||0) + (Number(product.stock)||0);
    primary.minStock = Math.max(Number(primary.minStock)||0, Number(product.minStock)||0);
    if(!primary.image && product.image) primary.image = product.image;
    if(!primary.cost && product.cost) primary.cost = product.cost;
    if(!primary.price && product.price) primary.price = product.price;
    removed++;
  }
  if(!removed) return 0;
  PRODUCTS = cleaned;
  await persistProducts();
  return removed;
}
async function persistSettings(){
  APP_SETTINGS = normalizeAppSettings(APP_SETTINGS);
  await storageSet('inhala_settings', APP_SETTINGS);
  applyAppearance();
  if(CLOUD) await CLOUD.saveSettings(APP_SETTINGS);
}
function startCloudSync(){
  if(!CLOUD || stopCloudSync) return;
  stopCloudSync = CLOUD.subscribe(data => {
    if(!Array.isArray(data.products)) return;
    PRODUCTS = data.products; manualSkuSeq = data.seq || 1;
    if(document.getElementById('app').style.display !== 'none') setView(VIEW);
  }, data => {
    if(!Array.isArray(data.sales)) return;
    SALES = data.sales;
    if(VIEW==='dashboard' || VIEW==='historial') setView(VIEW);
  }, data => {
    if(!Array.isArray(data.clients)) return;
    CLIENTS = data.clients;
    if(VIEW==='clientes' || VIEW==='venta') setView(VIEW);
  }, data => {
    APP_SETTINGS = normalizeAppSettings(data.settings);
    applyAppearance();
    if(VIEW==='configuracion') renderConfiguracion();
  });
}

function fmtDateTime(iso){
  const d = new Date(iso);

}

function stockBadge(p){

}

/* ================= PRODUCTOS ================= */
function getCategories(){
  return Array.from(new Set(PRODUCTS.map(p=>p.category))).sort();
}

function filteredProducts(){
  let list = PRODUCTS;
  if(pf.search.trim()){
    const q = pf.search.trim().toLowerCase();
    list = list.filter(p => p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || (p.provider||'').toLowerCase().includes(q) || (p.barcode||'').toLowerCase().includes(q));
  }
  if(pf.category!=='all') list = list.filter(p=>p.category===pf.category);
  if(pf.status==='low') list = list.filter(p=>p.stock>0 && p.stock<=p.minStock);
  if(pf.status==='out') list = list.filter(p=>p.stock<=0);
  if(pf.status==='ok') list = list.filter(p=>p.stock>p.minStock);
  const dir = pf.sortDir==='asc'?1:-1;
  list = list.slice().sort((a,b)=>{
    let va=a[pf.sortKey], vb=b[pf.sortKey];
    if(typeof va==='string'){ va=va.toLowerCase(); vb=vb.toLowerCase(); }
    if(va<vb) return -1*dir; if(va>vb) return 1*dir; return 0;
  });
  return list;
}

function startInlineEdit(td){
  if(td.querySelector('input, select')) return;
  const tr = td.closest('tr');
  const sku = tr.dataset.sku;
  const field = td.dataset.field;
  const p = PRODUCTS.find(x=>x.sku===sku);
  if(!p) return;
  const current = p[field];
  const numeric = ['cost','price','stock','minStock'].includes(field);
  if(field==='category'){
    const cats = Array.from(new Set([...getCategories(), current])).filter(Boolean).sort();
    td.innerHTML = `<select class="cell-edit" style="min-width:145px;">${cats.map(c=>`<option value="${esc(c)}" ${c===current?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
  } else {
    td.innerHTML = `<input class="cell-edit" type="${numeric?'number':'text'}" ${numeric?'step="0.01" min="0"':''} value="${esc(current)}">`;
  }
  const input = td.querySelector('input, select');
  input.focus(); if(input.select) input.select();
  const commit = async () => {
    let val;
    if(numeric){
      val = parseFloat(input.value);
      if(isNaN(val) || val<0) val = 0;
      if(field==='stock' || field==='minStock') val = Math.round(val);
    } else {
      val = input.value.trim();
      if(!val) val = field==='category' ? 'Otros' : (field==='provider' ? 'Sin proveedor' : p[field]);
    }
    p[field] = val;
    await persistProducts();
    renderProductos();
    if(VIEW==='dashboard') renderDashboard();
  };
  input.onblur = commit;
  input.onchange = () => { if(field==='category') input.blur(); };
  input.onkeydown = e => { if(e.key==='Enter') input.blur(); if(e.key==='Escape'){ renderProductos(); } };
}

          <label class="field-label" id="bulkValueLabel">Valor (%)</label>

    const list = scopeProducts(scope, catVal);
    const mode = $('#bulkMode').value;
    $('#bulkValueLabel').textContent = 'Valor (' + (mode==='pct'?'%':'$') + ')';
    const val = parseFloat($('#bulkValue').value);
    const dirLabel = $('#bulkDir').value==='inc' ? 'aumentado' : 'disminuido';
    const fieldLabel = $('#bulkField').value==='both' ? 'costo y venta' : ($('#bulkField').value==='cost'?'costo':'venta');

      $('#bulkPreview').textContent = 'No hay productos en este grupo.';

  $('#bulkMode').onchange = updatePreview;
  $('#bulkValue').oninput = updatePreview;

  $('#applyBulk').onclick = async () => {
    const scope = getScope();
    const catVal = $('#scopeCatSelect') ? $('#scopeCatSelect').value : '';
    const list = scopeProducts(scope, catVal);
    const field = $('#bulkField').value; // price | cost | both
    const dir = $('#bulkDir').value;      // inc | dec
    const mode = $('#bulkMode').value;    // pct | fixed
    const val = parseFloat($('#bulkValue').value);
    if(!list.length){ toast('No hay productos en ese grupo', true); return; }
    if(isNaN(val) || val<=0){ toast('Ingresá un valor mayor a 0', true); return; }

    const fields = field==='both' ? ['cost','price'] : [field];
    const skuSet = new Set(list.map(p=>p.sku));
    PRODUCTS.forEach(p => {
      if(!skuSet.has(p.sku)) return;
      fields.forEach(f => {
        const cur = p[f];
        const delta = mode==='pct' ? cur*(val/100) : val;
        let next = dir==='inc' ? cur+delta : cur-delta;
        next = Math.max(0, Math.round(next*100)/100);
        p[f] = next;
      });
    });
    await persistProducts();
    closeModal();
    toast(`Precio actualizado en ${fmtInt(list.length)} producto${list.length===1?'':'s'}`);
    renderProductos();
    if(VIEW==='dashboard') renderDashboard();
  };
}

/* ---------- Importación de precios (Excel / CSV / captura) ---------- */
function normalizedText(value){
  return String(value==null?'':value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
}
function moneyValue(value){
  if(typeof value==='number') return Number.isFinite(value) ? value : NaN;
  let s = String(value==null?'':value).trim().replace(/\$/g,'').replace(/\s/g,'');
  if(!s) return NaN;
  if(s.includes('.') && s.includes(',')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',', '.') : s.replace(/,/g,'');
  else if(s.includes(',')) s = s.replace(',', '.');
  return Number(s.replace(/[^0-9.-]/g,''));
}
function productLookup(value, isSku){
  const v = normalizedText(value);
  if(!v) return null;
  if(isSku) return PRODUCTS.find(p=>normalizedText(p.sku)===v) || null;
  return PRODUCTS.find(p=>normalizedText(p.name)===v) || null;
}
function rowsToUpdates(rows){
  const updates = [], ignored = [];
  rows.forEach((row, index) => {
    const clean = {};
    Object.keys(row||{}).forEach(k=> clean[normalizedText(k)] = row[k]);
    const sku = clean.sku ?? clean.codigo ?? clean['cod producto'] ?? clean['codigo producto'];
    const name = clean.producto ?? clean.nombre ?? clean.descripcion ?? clean.articulo;
    const price = clean['precio venta'] ?? clean.venta ?? clean.precio ?? clean['precio lista'] ?? clean.pvp;
    const cost = clean.costo ?? clean['precio costo'] ?? clean['costo compra'];
    const p = productLookup(sku, true) || productLookup(name, false);
    const sale = moneyValue(price), purchase = moneyValue(cost);
    if(!p || (isNaN(sale) && isNaN(purchase))){ ignored.push(index+2); return; }
    updates.push({sku:p.sku, name:p.name, price:isNaN(sale)?null:Math.max(0,sale), cost:isNaN(purchase)?null:Math.max(0,purchase)});
  });
  const unique = new Map(); updates.forEach(u=>unique.set(u.sku,u));
  return {updates:[...unique.values()], ignored};
}

function previewPriceUpdates(result, source){
  const {updates, ignored} = result;

      </tbody></table></div>${updates.length>100?`<div class="hint" style="margin-top:8px;">Se muestran los primeros 100 resultados.</div>`:''}
    </div>

  `);
  $('#applyImportedPrices').onclick = async () => {

    await persistProducts(); closeModal(); toast(`Precios actualizados en ${fmtInt(updates.length)} producto${updates.length===1?'':'s'}`); renderProductos(); if(VIEW==='dashboard') renderDashboard();
  };
}
function importPriceSheet(file){
  const lower = file.name.toLowerCase();
  const reader = new FileReader();
  reader.onerror = () => showImportState('No se pudo leer el archivo.', true);
  reader.onload = () => {
    try{
      let rows;
      if(lower.endsWith('.csv')){
        const text = String(reader.result||''); const lines = text.split(/\r?\n/).filter(Boolean); const sep = (lines[0]||'').includes(';') ? ';' : ',';
        const headers = (lines.shift()||'').split(sep).map(s=>s.replace(/^"|"$/g,'').trim());
        rows = lines.map(line=>{ const cells=line.split(sep).map(s=>s.replace(/^"|"$/g,'').trim()); return Object.fromEntries(headers.map((h,i)=>[h,cells[i]??''])); });
      } else {
        if(!window.XLSX) throw new Error('La librería para leer Excel no está disponible. Verificá la conexión y volvé a abrir la aplicación.');
        const wb = XLSX.read(reader.result, {type:'array'}); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
      }
      const result = rowsToUpdates(rows); previewPriceUpdates(result, file.name);
    }catch(err){ showImportState(err.message || 'El archivo no tiene un formato válido.', true); }
  };
  if(lower.endsWith('.csv')) reader.readAsText(file, 'UTF-8'); else reader.readAsArrayBuffer(file);
}
function loadOcr(){
  if(window.Tesseract) return Promise.resolve();
  return new Promise((resolve,reject)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'; s.onload=resolve; s.onerror=()=>reject(new Error('No se pudo cargar el lector de imágenes.')); document.head.appendChild(s); });
}

// Carga ZXing como fallback cuando el navegador no soporta la Barcode Detection API nativa.
function loadZXing(){
  if(window.ZXingBrowser) return Promise.resolve();
  return new Promise((resolve,reject)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js'; s.onload=resolve; s.onerror=()=>reject(new Error('No se pudo cargar el lector de códigos de barra.')); document.head.appendChild(s); });
}

// Abre un modal con la cámara y detecta códigos de barra en vivo.
// onResult(code) se llama con cada código detectado; el modal permanece abierto
// para poder escanear varios productos seguidos (útil en el POS).
// Devuelve una función stopScanner() por si se necesita cerrar la cámara de forma manual.
function openBarcodeScanner(onResult, opts){
  const options = opts || {};
  const title = options.title || 'Escanear código de barras';
  const hint = options.hint || 'Apuntá la cámara al código de barras del producto.';
  let stream = null, stopped = false, zxingControls = null, detectLoop = null;
  let lastCode = null, lastCodeAt = 0;
  const reportCode = raw => {
    const code = String(raw||'').trim();
    if(!code) return;
    const now = Date.now();
    if(code===lastCode && (now-lastCodeAt)<2000) return; // evita re-disparar el mismo código en frames seguidos
    lastCode = code; lastCodeAt = now;
    onResult(code);
  };

  showModal(`
    <div class="modal-head"><h3>${ICONS.barcode} ${esc(title)}</h3><button class="icon-btn" data-close>${ICONS.close}</button></div>
    <div class="modal-body">
      <div class="hint" style="margin-bottom:10px;">${esc(hint)}</div>
      <div id="scannerWrap" style="position:relative; width:100%; border-radius:12px; overflow:hidden; background:#000; min-height:220px; display:flex; align-items:center; justify-content:center;">
        <video id="scannerVideo" autoplay playsinline muted style="width:100%; display:block;"></video>
        <div id="scannerStatus" class="muted" style="position:absolute; color:#fff; font-size:12px; padding:6px 10px; background:rgba(0,0,0,.45); border-radius:8px; bottom:10px; left:10px; right:10px;">Iniciando cámara…</div>
      </div>
      <div class="field-row" style="margin-top:12px;">
        <div>
          <label class="field-label">O ingresalo manualmente</label>
          <input id="scannerManualInput" style="width:100%;" placeholder="Escribí el código y presioná Enter">
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" data-close>Cerrar</button>
    </div>
  `);

  const statusEl = () => document.getElementById('scannerStatus');
  const setStatus = msg => { const s = statusEl(); if(s) s.textContent = msg; };

  function stopScanner(){
    if(stopped) return;
    stopped = true;
    if(detectLoop) cancelAnimationFrame(detectLoop);
    if(zxingControls){ try{ zxingControls.stop(); }catch(e){} }
    if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  }

  const stopAndClose = () => { stopScanner(); closeModal(); };
  $all('[data-close]', $('#modalBox')).forEach(b => b.onclick = stopAndClose);
  $('#overlay').onclick = e => { if(e.target.id==='overlay') stopAndClose(); };

  const manualInput = document.getElementById('scannerManualInput');
  manualInput.onkeydown = e => {
    if(e.key==='Enter'){
      const v = manualInput.value.trim();
      if(v){ reportCode(v); manualInput.value=''; }
    }
  };

  (async () => {
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    }catch(err){
      setStatus('No se pudo acceder a la cámara. Ingresá el código manualmente.');
      toast('No se pudo acceder a la cámara del dispositivo', true);
      return;
    }
    if(stopped){ stream.getTracks().forEach(t=>t.stop()); return; }
    const video = document.getElementById('scannerVideo');
    video.srcObject = stream;
    await video.play().catch(()=>{});

    if('BarcodeDetector' in window){
      setStatus('Buscando código…');
      let detector;
      try{ detector = new BarcodeDetector(); }
      catch(e){ detector = null; }
      if(detector){
        const tick = async () => {
          if(stopped) return;
          try{
            const codes = await detector.detect(video);
            if(codes && codes.length){
              setStatus('Código detectado: ' + codes[0].rawValue);
              reportCode(codes[0].rawValue);
            }
          }catch(e){ /* frame no legible, seguimos intentando */ }
          if(!stopped) detectLoop = requestAnimationFrame(tick);
        };
        detectLoop = requestAnimationFrame(tick);
        return;
      }
    }

    // Fallback: ZXing
    try{
      setStatus('Cargando lector de códigos…');
      await loadZXing();
      if(stopped) return;
      setStatus('Buscando código…');
      const codeReader = new ZXingBrowser.BrowserMultiFormatReader();
      zxingControls = await codeReader.decodeFromStream(stream, video, (result, err, controls) => {
        zxingControls = controls;
        if(result){
          setStatus('Código detectado: ' + result.getText());
          reportCode(result.getText());
        }
      });
    }catch(err){
      setStatus('Tu navegador no soporta lectura automática. Ingresá el código manualmente.');
    }
  })();

  return stopScanner;
}
async function importPriceImage(file){
  showImportState('Leyendo la captura. Esto puede tardar unos segundos.', false);
  try{
    await loadOcr();
    const out = await Tesseract.recognize(file, 'spa');
    const rows = out.data.text.split(/\r?\n/).filter(Boolean).map(line=>{
      const sku = (line.match(/\b[A-Z0-9-]{3,}\b/i)||[])[0] || '';
      const prices = line.match(/\$?\s*\d{1,3}(?:[.\s]\d{3})*(?:,\d{1,2})?|\$?\s*\d+(?:\.\d{1,2})?/g) || [];
      return {SKU:sku, 'Precio de venta':prices.length?prices[prices.length-1]:''};
    });
    previewPriceUpdates(rowsToUpdates(rows), file.name);
  }catch(err){ showImportState(err.message || 'No se pudo leer la imagen.', true); }
}

}

function confirmDeleteClient(id){
  const client=CLIENTS.find(c=>c.id===id); if(!client) return;
  showModal(`<div class="modal-head"><h3>Eliminar cliente</h3><button class="icon-btn" data-close>${ICONS.close}</button></div><div class="modal-body"><p style="margin:0; line-height:1.5;">Se eliminará <b>${esc(client.name)}</b> de la base. Las ventas históricas conservarán su nombre.</p></div><div class="modal-foot"><button class="btn secondary" data-close>Cancelar</button><button class="btn danger" id="deleteClient">${ICONS.trash} Eliminar</button></div>`);
  $('#deleteClient').onclick=async()=>{ CLIENTS=CLIENTS.filter(c=>c.id!==id); await persistClients(); closeModal(); renderClientes(); toast('Cliente eliminado'); };
}

  `;
  const preview = (field, target, type) => {

}

// Busca un producto por código de barras y lo agrega al carrito (usado por el escáner del POS).
function addToCartByBarcode(code){
  const p = PRODUCTS.find(x => x.barcode && x.barcode===code);
  if(!p){ toast('No se encontró ningún producto con ese código de barras', true); return; }
  addToCart(p.sku);
}
function addToCart(sku){
  const p = PRODUCTS.find(x=>x.sku===sku);
  if(!p) return;
  if(p.stock<=0){ toast('Sin stock disponible de "'+p.name+'"', true); return; }
  const existing = cart.find(c=>c.sku===sku);
  if(existing){
    if(existing.qty>=p.stock){ toast('No hay más stock disponible', true); return; }
    existing.qty++;
  } else {
    cart.push({sku:p.sku, name:p.name, price:p.price, cost:p.cost, stock:p.stock, image:p.image||'', qty:1});
  }
  renderCart();
}

function renderCart(){
  const box = $('#cartItems');
  const totals = $('#cartTotals');
  if(!box) return;
  box.innerHTML = cart.length ? cart.map(c => { const product=PRODUCTS.find(p=>p.sku===c.sku)||c; return `
    <div class="cart-item" data-sku="${esc(c.sku)}">
      <div class="cart-product">${productThumb(product, 42)}<div class="name">${esc(c.name)}<div class="muted" style="font-size:11px; font-weight:400;">SKU ${esc(c.sku)}</div></div></div>
      <div class="cart-unit">${fmt(c.price)}</div>
      <div class="qty-ctrl">
        <button data-qty="-1">${ICONS.minus}</button>
        <input value="${c.qty}" data-qtyinput>
        <button data-qty="1">${ICONS.plus}</button>
      </div>
      <div class="strong num cart-subtotal">${fmt(c.price*c.qty)}</div>
      <button class="icon-btn" data-remove>${ICONS.close}</button>
    </div>
  `; }).join('') : `<div class="empty" style="padding:30px 8px;">${ICONS.cart}<div class="t">El carrito está vacío</div>Buscá un producto a la izquierda para agregarlo.</div>`;

  const total = cart.reduce((a,c)=>a+c.price*c.qty,0);
  const totalCost = cart.reduce((a,c)=>a+c.cost*c.qty,0);
  const units = cart.reduce((a,c)=>a+c.qty,0);
  const pill = $('#cartPill');
  if(pill) pill.textContent = `${cart.length} producto${cart.length===1?'':'s'} · ${units} ${units===1?'unidad':'unidades'}`;
  totals.innerHTML = cart.length ? `
    <div class="cart-total-row"><span class="muted">Unidades totales</span><span class="strong">${units}</span></div>
    <div class="cart-total-row"><span class="muted">Subtotal</span><span class="strong">${fmt(total)}</span></div>
    <div class="cart-total-row grand"><span>Total</span><span>${fmt(total)}</span></div>
  ` : '';

  $all('[data-qty]', box).forEach(b => b.onclick = () => {
    const sku = b.closest('.cart-item').dataset.sku;
    const item = cart.find(c=>c.sku===sku);
    const delta = parseInt(b.dataset.qty);
    const p = PRODUCTS.find(x=>x.sku===sku);
    const next = item.qty + delta;
    if(next<=0){ cart = cart.filter(c=>c.sku!==sku); }
    else if(p && next>p.stock){ toast('No hay más stock disponible', true); return; }
    else { item.qty = next; }
    renderCart();
  });
  $all('[data-qtyinput]', box).forEach(inp => {
    inp.onchange = () => {
      const sku = inp.closest('.cart-item').dataset.sku;
      const item = cart.find(c=>c.sku===sku);
      const p = PRODUCTS.find(x=>x.sku===sku);
      let v = Math.round(parseFloat(inp.value))||0;
      if(v<=0){ cart = cart.filter(c=>c.sku!==sku); }
      else { if(p && v>p.stock){ v=p.stock; toast('Ajustado al stock disponible ('+p.stock+')', true); } item.qty = v; }
      renderCart();
    };
  });
  $all('[data-remove]', box).forEach(b => b.onclick = () => {
    const sku = b.closest('.cart-item').dataset.sku;
    cart = cart.filter(c=>c.sku!==sku);
    renderCart();
  });
}

async function confirmSale(){
  if(!cart.length){ toast('Agregá al menos un producto', true); return; }
  for(const c of cart){
    const p = PRODUCTS.find(x=>x.sku===c.sku);
    if(!p || c.qty>p.stock){ toast('Stock insuficiente para "'+c.name+'"', true); return; }
  }
  const items = cart.map(c => ({sku:c.sku, name:c.name, qty:c.qty, price:c.price, cost:c.cost, total:c.price*c.qty}));
  const total = items.reduce((a,i)=>a+i.total,0);
  const totalCost = items.reduce((a,i)=>a+i.cost*i.qty,0);
  const selectedClient = CLIENTS.find(c=>c.id===saleDraft.clientId);
  const sale = {id:'V-'+Date.now(), date:new Date().toISOString(), clientId:selectedClient?selectedClient.id:'', clientName:selectedClient?selectedClient.name:'', reference:saleDraft.reference.trim(), note:saleDraft.note.trim(), items, total, totalCost, profit: total-totalCost};
  cart.forEach(c => { const p = PRODUCTS.find(x=>x.sku===c.sku); if(p) p.stock -= c.qty; });
  SALES.push(sale);
  await persistProducts();
  await persistSales();
  cart = [];
  saleDraft = {clientId:'', reference:'', note:''};
  renderVenta();
  toast('Venta ' + sale.id.replace('V-','') + ' registrada por ' + fmt(sale.total));
}

/* ================= HISTORIAL / REPORTES ================= */
function periodKey(dateIso, period){
  const d = new Date(dateIso);
  if(period==='day') return d.toISOString().slice(0,10);
  if(period==='month') return d.toISOString().slice(0,7);
  // week: ISO week start (Monday)
  const day = (d.getDay()+6)%7;
  const monday = new Date(d); monday.setDate(d.getDate()-day);
  return monday.toISOString().slice(0,10) + ' (sem.)';
}

function filteredSales(){
  let list = SALES;
  if(hf.from) list = list.filter(s => s.date.slice(0,10) >= hf.from);
  if(hf.to) list = list.filter(s => s.date.slice(0,10) <= hf.to);
  if(hf.product.trim()){
    const q = hf.product.trim().toLowerCase();
    list = list.filter(s => s.items.some(i => i.name.toLowerCase().includes(q) || i.sku.toLowerCase().includes(q)));
  }
  return list.slice().sort((a,b)=> b.date.localeCompare(a.date));
}

function renderHistorial(){
  const el = $('#view-historial');
  const list = filteredSales();
  const total = list.reduce((a,s)=>a+s.total,0);
  const cost = list.reduce((a,s)=>a+s.totalCost,0);
  const profit = total-cost;
  const units = list.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.qty,0),0);

  const groups = {};
  list.forEach(s => {
    const k = periodKey(s.date, hf.period);
    if(!groups[k]) groups[k] = {total:0, cost:0, units:0, count:0};
    groups[k].total += s.total; groups[k].cost += s.totalCost;
    groups[k].units += s.items.reduce((x,i)=>x+i.qty,0); groups[k].count++;
  });
  const groupKeys = Object.keys(groups).sort().reverse();

  el.innerHTML = `
    <div class="toolbar">
      <div><label class="field-label">Desde</label><input type="date" id="hFrom" value="${hf.from}"></div>
      <div><label class="field-label">Hasta</label><input type="date" id="hTo" value="${hf.to}"></div>
      <div style="flex:1; min-width:200px;"><label class="field-label">Producto</label><div class="search">${ICONS.search}<input id="hProduct" placeholder="Nombre o SKU…" value="${esc(hf.product)}"></div></div>
      <div>
        <label class="field-label">Agrupar por</label>
        <div class="chip-row">
          <button class="chip ${hf.period==='day'?'active':''}" data-period="day">Día</button>
          <button class="chip ${hf.period==='week'?'active':''}" data-period="week">Semana</button>
          <button class="chip ${hf.period==='month'?'active':''}" data-period="month">Mes</button>
        </div>
      </div>
    </div>

    <div class="grid kpis" style="grid-template-columns:repeat(4,1fr); margin-bottom:18px;">
      <div class="card kpi"><div class="kpi-bar"></div><div class="label">${ICONS.cart} Ventas</div><div class="value">${fmtInt(list.length)}</div><div class="delta">${fmtInt(units)} unidades vendidas</div></div>
      <div class="card kpi"><div class="kpi-bar"></div><div class="label">${ICONS.money} Facturado</div><div class="value" style="font-size:21px;">${fmt(total)}</div><div class="delta">en el período filtrado</div></div>
      <div class="card kpi"><div class="kpi-bar"></div><div class="label">${ICONS.money} Costo de mercadería</div><div class="value" style="font-size:21px;">${fmt(cost)}</div><div class="delta">costo de lo vendido</div></div>
      <div class="card kpi"><div class="kpi-bar"></div><div class="label">${ICONS.trend} Ganancia</div><div class="value" style="font-size:21px; color:var(--green-700);">${fmt(profit)}</div><div class="delta">facturado − costo</div></div>
    </div>

    <div class="card" style="padding:18px 20px; margin-bottom:16px;">
      <h2 class="section-title">Totales por ${hf.period==='day'?'día':hf.period==='week'?'semana':'mes'}</h2>
      ${groupKeys.length ? `<table>
        <thead><tr><th>Período</th><th style="text-align:right;">Ventas</th><th style="text-align:right;">Unidades</th><th style="text-align:right;">Facturado</th><th style="text-align:right;">Ganancia</th></tr></thead>
        <tbody>${groupKeys.map(k => { const g = groups[k]; return `<tr>
          <td>${esc(k)}</td><td class="num" style="text-align:right;">${g.count}</td>
          <td class="num" style="text-align:right;">${g.units}</td>
          <td class="num" style="text-align:right;">${fmt(g.total)}</td>
          <td class="num" style="text-align:right; color:var(--green-700); font-weight:700;">${fmt(g.total-g.cost)}</td>
        </tr>`; }).join('')}</tbody>
      </table>` : `<div class="empty">${ICONS.empty}<div class="t">No hay ventas en este rango</div></div>`}
    </div>

    <div class="card" style="padding:18px 20px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;"><h2 class="section-title">Detalle de ventas</h2><span class="hint">Cada fila es una venta completa</span></div>
      ${list.length ? `<table>
        <thead><tr><th>Venta</th><th>Fecha</th><th>Productos</th><th style="text-align:right;">Unidades</th><th style="text-align:right;">Total</th><th style="text-align:right;">Ganancia</th><th style="text-align:right;">Acciones</th></tr></thead>
        <tbody>${list.slice(0,300).map(s => `<tr>
          <td><div class="strong">#${esc(String(s.id||'').replace('V-',''))}</div>${s.clientName?`<div class="muted" style="font-size:11px;">${esc(s.clientName)}</div>`:(s.reference?`<div class="muted" style="font-size:11px;">${esc(s.reference)}</div>`:'')}</td>
          <td class="num">${fmtDateTime(s.date)}</td>
          <td><div class="strong" style="font-size:12px;">${s.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</div>${s.note?`<div class="muted" style="font-size:11px; margin-top:3px;">${esc(s.note)}</div>`:''}</td>
          <td class="num" style="text-align:right;">${s.items.reduce((a,i)=>a+i.qty,0)}</td>
          <td class="num" style="text-align:right;">${fmt(s.total)}</td>
          <td class="num" style="text-align:right; color:var(--green-700); font-weight:700;">${fmt(s.profit)}</td>
          <td style="text-align:right; white-space:nowrap;"><div class="sale-history-actions"><button class="btn secondary sm" data-sale-edit="${esc(s.id)}">${ICONS.edit} Ver / editar</button><button class="icon-btn" data-sale-del="${esc(s.id)}" title="Eliminar venta">${ICONS.trash}</button></div></td>
        </tr>`).join('')}</tbody>
      </table>${list.length>300?`<div class="hint" style="margin-top:8px;">Mostrando las 300 ventas más recientes del rango filtrado.</div>`:''}` : `<div class="empty">${ICONS.empty}<div class="t">No hay ventas para mostrar</div></div>`}
    </div>
  `;

  $('#hFrom').onchange = e => { hf.from = e.target.value; renderHistorial(); };
  $('#hTo').onchange = e => { hf.to = e.target.value; renderHistorial(); };
  $('#hProduct').oninput = e => { hf.product = e.target.value; withFocusPreserved(renderHistorial); };
  $all('[data-period]').forEach(b => b.onclick = () => { hf.period = b.dataset.period; renderHistorial(); });
  $all('[data-sale-edit]').forEach(b => b.onclick = () => openSaleEditor(b.dataset.saleEdit));
  $all('[data-sale-del]').forEach(b => b.onclick = () => confirmDeleteSale(b.dataset.saleDel));
}

function recomputeSale(sale){
  sale.items = sale.items.filter(i=>i.qty>0).map(i=>({ ...i, qty:Math.max(1,Math.round(i.qty||0)), price:Math.max(0,Number(i.price)||0), cost:Math.max(0,Number(i.cost)||0), total:Math.max(0,Number(i.price)||0)*Math.max(1,Math.round(i.qty||0)) }));
  sale.total = sale.items.reduce((a,i)=>a+i.total,0);
  sale.totalCost = sale.items.reduce((a,i)=>a+i.cost*i.qty,0);
  sale.profit = sale.total-sale.totalCost;
}
function confirmDeleteSale(id){
  const sale = SALES.find(s=>s.id===id); if(!sale) return;
  showModal(`
    <div class="modal-head"><h3>Eliminar venta #${esc(String(id).replace('V-',''))}</h3><button class="icon-btn" data-close>${ICONS.close}</button></div>
    <div class="modal-body"><p style="margin:0; line-height:1.5;">Se eliminará la venta y se devolverá el stock de sus ${sale.items.reduce((a,i)=>a+i.qty,0)} unidades al inventario.</p></div>
    <div class="modal-foot"><button class="btn secondary" data-close>Cancelar</button><button class="btn danger" id="confirmDeleteSale">${ICONS.trash} Eliminar venta</button></div>
  `);
  $('#confirmDeleteSale').onclick = async () => {
    sale.items.forEach(i=>{ const p=PRODUCTS.find(x=>x.sku===i.sku); if(p) p.stock+=i.qty; });
    SALES = SALES.filter(s=>s.id!==id);
    await persistProducts(); await persistSales(); closeModal(); renderHistorial(); toast('Venta eliminada y stock devuelto');
  };
}
function openSaleEditor(id){
  const original = SALES.find(s=>s.id===id); if(!original) return;
  const sale = JSON.parse(JSON.stringify(original));
  const draw = () => {
    showModal(`
      <div class="modal-head"><h3>Editar venta #${esc(String(id).replace('V-',''))}</h3><button class="icon-btn" data-close>${ICONS.close}</button></div>
      <div class="modal-body">
        <div class="field-row"><div><label class="field-label">Fecha y hora</label><input id="editSaleDate" type="datetime-local" style="width:100%;" value="${new Date(sale.date).toISOString().slice(0,16)}"></div><div><label class="field-label">Referencia o comprador</label><input id="editSaleReference" style="width:100%;" value="${esc(sale.reference||'')}"></div></div>
        <div><label class="field-label">Nota interna</label><input id="editSaleNote" style="width:100%;" value="${esc(sale.note||'')}"></div>
        <div style="overflow:auto; margin-top:12px;"><table><thead><tr><th>Producto</th><th style="text-align:right;">Cantidad</th><th style="text-align:right;">Precio unit.</th><th></th></tr></thead><tbody>
          ${sale.items.map((i,n)=>`<tr><td><div class="strong">${esc(i.name)}</div><div class="muted">SKU ${esc(i.sku)}</div></td><td style="text-align:right;"><input data-edit-qty="${n}" type="number" min="0" step="1" value="${i.qty}" style="width:76px; text-align:right;"></td><td style="text-align:right;"><input data-edit-price="${n}" type="number" min="0" step="0.01" value="${i.price}" style="width:112px; text-align:right;"></td><td style="text-align:right;"><button class="icon-btn" data-edit-remove="${n}" title="Quitar producto">${ICONS.close}</button></td></tr>`).join('')}
        </tbody></table></div>
        <div class="hint" style="margin-top:10px;">La modificación ajusta automáticamente el stock según la diferencia de cantidades.</div>
      </div>
      <div class="modal-foot"><button class="btn secondary" data-close>Cancelar</button><button class="btn" id="saveSaleEdit">${ICONS.check} Guardar venta</button></div>
    `);
    $all('[data-edit-remove]').forEach(b=>b.onclick=()=>{ sale.items.splice(+b.dataset.editRemove,1); draw(); });
    $('#saveSaleEdit').onclick = async () => {
      sale.items.forEach((i,n)=>{ i.qty=Math.max(0,Math.round(parseFloat($(`[data-edit-qty="${n}"]`).value)||0)); i.price=Math.max(0,parseFloat($(`[data-edit-price="${n}"]`).value)||0); });
      if(!sale.items.some(i=>i.qty>0)){ toast('La venta debe tener al menos un producto', true); return; }
      const oldBySku = new Map(original.items.map(i=>[i.sku,i.qty]));
      for(const i of sale.items){ const p=PRODUCTS.find(x=>x.sku===i.sku); const available=(p?p.stock:0)+(oldBySku.get(i.sku)||0); if(!p || i.qty>available){ toast('Stock insuficiente para "'+i.name+'"', true); return; } }
      original.items.forEach(i=>{ const p=PRODUCTS.find(x=>x.sku===i.sku); if(p) p.stock+=i.qty; });
      sale.items.forEach(i=>{ const p=PRODUCTS.find(x=>x.sku===i.sku); p.stock-=i.qty; });
      sale.date = new Date($('#editSaleDate').value).toISOString(); sale.reference=$('#editSaleReference').value.trim(); sale.note=$('#editSaleNote').value.trim(); recomputeSale(sale);
      Object.assign(original,sale); await persistProducts(); await persistSales(); closeModal(); renderHistorial(); toast('Venta actualizada');
    };
  };
  draw();
}

/* ================= INIT ================= */
function showFirebaseLogin(){
  const form = document.getElementById('firebaseLogin');
  if(form){ form.style.display='block'; document.getElementById('loadingMessage').textContent='Ingresá con el usuario autorizado.'; }
}
window.addEventListener('inhala-auth-required', showFirebaseLogin);
window.addEventListener('inhala-authenticated', () => {
  const form = document.getElementById('firebaseLogin');
  if(form) form.style.display='none';
  document.getElementById('loadingMessage').textContent='Cargando datos seguros…';
});
document.getElementById('firebaseLogin').onsubmit = async e => {
  e.preventDefault();
  const error = document.getElementById('firebaseLoginError');
  error.style.display='none';
  try{
    const cloud = await waitForCloud();
    await cloud.signIn(document.getElementById('firebaseEmail').value.trim(), document.getElementById('firebasePassword').value);
  }catch(err){
    error.textContent = 'Correo o contraseña incorrectos.';
    error.style.display='block';
  }
};
async function init(){
  APP_SETTINGS = normalizeAppSettings(await storageGet('inhala_settings'));
  applyAppearance();
  await loadData();
  await removeExactInventoryDuplicates();
  renderNav();
  renderDashboard();
  setView('dashboard');
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  startCloudSync();
}
init();

})();

</script>
